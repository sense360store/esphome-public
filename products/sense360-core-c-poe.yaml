# ============================================================================
# SENSE360 CORE CEILING - POE POWER
# ============================================================================
# SKU: S360-CORE-C-POE
#
# Base configuration for Sense360 Core Ceiling with PoE power.
# Ideal for professional installations with existing network infrastructure.
#
# Hardware:
# - Core: S360-CORE-C (Ceiling mount, non-voice)
# - Power: PoE (IEEE 802.3af, 36-57V input, 5V/2A output)
# - LED: Optional (add led_ring_ceiling.yaml if installed)
#
# Add expansion modules as needed:
# - AirIQ: packages/expansions/airiq_ceiling.yaml
# - Comfort: packages/expansions/comfort_ceiling.yaml
# - Presence: packages/expansions/presence_ceiling.yaml
# - Bathroom: packages/expansions/bathroom.yaml (mutually exclusive with AirIQ)
# - Fan: packages/expansions/fan_gp8403.yaml or fan_pwm.yaml
#
# ============================================================================
# CUSTOMER USAGE
# ============================================================================
# packages:
#   sense360:
#     url: https://github.com/sense360store/esphome-public
#     ref: v3.0.0
#     files:
#       - products/sense360-core-c-poe.yaml
#       # Add modules as needed:
#       # - packages/expansions/airiq_ceiling.yaml
#       # - packages/expansions/presence_ceiling.yaml
#
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#
# api:
#   encryption:
#     key: !secret api_encryption_key
#
# ota:
#   - platform: esphome
#     password: !secret ota_password
# ============================================================================

substitutions:
  device_name: sense360-ceiling-poe
  friendly_name: Sense360 Ceiling PoE
  # Canonical board SKU of the flashable hub (SENSE360-CANONICALISATION-001
  # PR 07): the legacy pre-catalog S360-CORE-C* scheme is retired; power /
  # mount facts stay published via the config string.
  device_sku: S360-100
  device_version: "3.0.0"
  timezone: "America/New_York"

  # Power configuration
  power_source: poe
  poe_class: "0"
  poe_standard: "802.3af"

  # Security (Define these in your secrets.yaml)

  # Logging
  log_level: INFO

  # WiFi
  wifi_fast_connect: "false"

# ============================================================================
# PACKAGE INCLUDES
# ============================================================================
packages:
  # === Base System Components ===
  base_wifi: !include ../packages/base/wifi.yaml
  base_logging: !include ../packages/base/logging.yaml
  base_api: !include ../packages/base/api_encrypted.yaml
  base_ota: !include ../packages/base/ota.yaml
  base_time: !include ../packages/base/time.yaml

  # === Core Hardware ===
  core_hardware: !include ../packages/boards/s360-100-core-ceiling.yaml

  # === Power Configuration ===
  power_config: !include ../packages/boards/s360-410-poe-psu.yaml

# ============================================================================
# PRODUCT IDENTIFICATION
# ============================================================================
text_sensor:
  - platform: template
    id: s360_product_sku
    name: "${friendly_name} Product SKU"
    lambda: |-
      return {"${device_sku}"};
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: s360_product_firmware_version
    name: "${friendly_name} Firmware Version"
    lambda: |-
      return {"${device_version}"};
    update_interval: never
    entity_category: diagnostic

# ============================================================================
# STATIC DIAGNOSTIC PUBLICATION (STATIC-DIAGNOSTIC-PUBLISH-001)
# ============================================================================
# The product-identification text sensors above hold compile-time constants,
# so they are declared `update_interval: never` — an immutable string must not
# be polled on a timer. A never-polled template text sensor also never
# evaluates its lambda, so each one is published exactly ONCE at boot.
# Priority 500 runs after the text-sensor components are set up (ESPHome
# `setup_priority::HARDWARE` = 800) and before every runtime framework boot hook
# (priority 250), so no runtime publisher is ever overwritten.
esphome:
  on_boot:
    - priority: 500
      then:
        - component.update: s360_product_sku
        - component.update: s360_product_firmware_version
