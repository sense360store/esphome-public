# ============================================================================
# EXTERNAL COMPONENTS CONFIGURATION
# ============================================================================
# This file declares external ESPHome components required by Sense360 products.
#
# Components:
#   - ld2412: HLK-LD2412 24GHz mmWave radar (superior still presence)
#   - ld2450: HLK-LD2450 24GHz mmWave radar (multi-target tracking)
#   - ld24xx: Shared base components for LD24xx radar family
# ============================================================================

external_components:
  # LD2412/LD2450/LD24xx radar drivers (SENSE360-CANONICALISATION-001 PR 10):
  # the vendored copies were retired under the no-fork rule - the pinned
  # ESPHome (>= 2026.4.5, requirements-dev.txt) ships built-in ld2412 /
  # ld2450 / ld24xx components, and every live composition validates against
  # them. No declaration is needed here: built-ins resolve natively for
  # repository builds AND remote consumers. Release tags keep the vendored
  # trees for tag-pinned consumers on older ESPHome versions.

  # Sense360 platform components (SENSE360-CANONICALISATION-001 PR 08/09):
  # the foundation component (shared engines + identity schema) and the
  # RoomIQ domain component. Declared as a LOCAL source deliberately - every
  # repository build lane compiles with products/ as the config directory
  # (the release workflow maps webflash wrappers back to the canonical
  # products/ path), so ../components is the checkout's own components tree
  # and a PR branch compiles ITS OWN component code, never main's. Remote
  # consumers never include this base package; they get these components
  # from the git-sourced declarations in the packages/remote/ wrappers.
  - source:
      type: local
      path: ../components
    components: [sense360, sense360_roomiq, sense360_presence]
