# ============================================================================
# SENSE360 LED FRAMEWORK — customer light, night mode and status experience
# ============================================================================
# LED-FRAMEWORK-001 (docs/architecture/sense360-led-framework.md).
#
# One polished, simple customer LED experience for the S360-300 WS2812B halo
# ring — the customer never needs to know about LED channels, GPIOs, RMT
# drivers or internal effects:
#
#   * Room Light          — the single customer light (defined by the board
#                           package packages/boards/s360-300-led.yaml).
#   * Night Mode          — low, warm, non-disruptive profile; never
#                           overwrites the customer's previous state.
#   * Night Mode Behaviour— Manual / When dark / When dark and occupied.
#                           ("Scheduled" is deferred: only SNTP/internet and
#                           Home Assistant time sources exist — neither is a
#                           reliable local-first scheduler.)
#   * Status Indicator    — Off / Essential / Detailed. Brief, discreet
#                           indications from REAL signals only (startup, API
#                           connect/disconnect, WiFi events); subordinate to
#                           the Room Light; no constant animations.
#   * Identify Device     — short, recognisable, non-disruptive pulse that
#                           restores the previous state automatically.
#   * Darkness Threshold  — customer-adjustable lux threshold with
#                           hysteresis; stale/missing lux is UNKNOWN and
#                           fails safe (never interpreted as dark). The
#                           decision itself is computed by the canonical
#                           RoomIQ environmental engine
#                           (ROOMIQ-FRAMEWORK-001): the component passes the
#                           customer threshold into that service and
#                           consumes the result — no duplicate lux logic.
#
# Optional inputs (LED-FRAMEWORK-002). RoomIQ and Presence are NOT hard
# dependencies. The full framework composes and degrades cleanly across
# Core+LED, Core+AirIQ+LED, Core+RoomIQ+LED, Core+Presence+LED and
# Core+RoomIQ+Presence+LED. Two compile-time flags declare what is present:
#   * led_has_roomiq   — RoomIQ (darkness) composed? enables "When dark".
#   * led_has_presence — Presence (occupancy) composed? together with RoomIQ
#                        enables "When dark and occupied".
# Both default "false". An automatic Night Mode Behaviour whose required input
# is absent is honestly downgraded to Manual (the engine, not this YAML, is the
# single source of truth); the "LED Night Mode Behaviour" diagnostic states
# which framework is missing. Manual Night Mode, Room Light, Status, Identify
# and restore work in EVERY composition. Missing lux is never read as dark and
# missing occupancy is never read as occupied — nothing is invented and no
# placeholder sensor is fabricated.
#
# Priority (LED-07): Fault > Identify > Night Mode > Room Light > Status.
# State ownership, fail-safe rules and the restore contract are implemented
# in the header-only engine components/sense360/led_controller.h — the SAME
# implementation exercised by the deterministic simulation tests
# (tests/unit/test_led_controller.cpp), so tested logic and shipped logic
# cannot drift. The contract is pinned by tests/test_led_framework.py.
#
# SENSE360-CANONICALISATION-001 PR 12: the glue that used to live here (the
# evaluate script's engine switchboard, the darkness service read, the
# customer-intent arbitration, the arbitrated light apply, the 250 ms tick
# and the diagnostics publishes) moved into the sense360_led domain
# component (components/sense360_led/, delivered with the other Sense360
# platform components — the former `esphome: includes:` header mechanism and
# its co-location hazard are gone structurally). This YAML keeps what is
# contractually YAML-shaped: the persisted customer-state globals and the
# boot-restore hook (NVS identity protected), the api/wifi status notify
# hooks, the customer entities, the night-mode switch (engine-truth lambda),
# the identify button and the 1 s stable-state persistence mirror.
#
# Composition contract: bundles compose this package together with
#   * the LED board package (packages/boards/s360-300-led.yaml — owns the
#     Room Light entity `led_ring` and the provisional software brightness
#     ceiling `led_max_brightness_pct`),
#   * OPTIONALLY the Presence framework (packages/features/presence_framework.yaml
#     — owns the fused Occupancy entity `s360_occupancy` and the Presence
#     module runtime status). LED-04 consumes ONLY the fused contract, never
#     raw PIR/radar/SEN0609 states, and never references the Presence id
#     directly: packages/features/led_presence_bridge.yaml (composed only when
#     Presence is present) feeds the fused Occupancy + validity straight into
#     the controller's occupancy input, so a Presence-less device still
#     composes,
#   * OPTIONALLY the RoomIQ environmental framework
#     (packages/features/roomiq_framework.yaml — owns the calibrated
#     canonical illuminance path and the darkness decision the component
#     consumes; ROOMIQ-FRAMEWORK-001) together with the RoomIQ board
#     package (packages/boards/s360-200-roomiq.yaml). The shared RoomIQ
#     engine is always in the build (component delivery), so on a
#     RoomIQ-less device the darkness decision is simply UNKNOWN (never
#     invented), and
#   * the shared Core Framework package under packages/base/ (owner of the
#     LED Module Status entity; this file deliberately does NOT include it —
#     bundles compose it exactly once, per the CORE-FRAMEWORK-001 isolation
#     rule).
# Only the catalog-declared LED-bearing bundles compose this package
# (bundle-authority gate in tests/test_led_framework.py).
#
# Module-status honesty: the WS2812B data line is one-way — the firmware can
# never verify that light was actually emitted, so this package does NOT
# drive the Core-Framework "LED Module Status" entity with the reserved
# runtime vocabulary. "Included" stays a compile-time fact, and the
# "LED Output Verification" diagnostic states the limit on-device. The
# engine's fault layer is a tested contract with NO production producer
# (no composed component exposes a supported LED fault signal today).
#
# Every brightness, colour and timing value below is a PROVISIONAL,
# software-defined engineering default pending bench validation
# (docs/hardware/led-framework-bench-checklist.md). NO hardware, bench,
# compliance or commercial claim is made by this package.
# ============================================================================

substitutions:
  # Night profile (LED-02) — provisional: low (5%) and warm (red-dominant,
  # low blue). The perceived colour through the diffuser is bench work.
  led_night_brightness_pct: "5"
  led_night_red: "1.0"
  led_night_green: "0.58"
  led_night_blue: "0.16"

  # Darkness decision (LED-05) — provisional: dark below the customer
  # threshold (default 20 lx), not-dark above threshold * 1.5 (hysteresis
  # prevents flicker near the threshold). The decision is computed by the
  # canonical RoomIQ engine from the CALIBRATED illuminance path with its
  # lux staleness window; this factor parameterises that service.
  led_darkness_hysteresis: "1.5"

  # Presence-driven auto-off delay (LED-04) — provisional. The fused
  # Occupancy entity already carries the Presence clear delay; this second
  # window only smooths automation-owned night-light behaviour.
  led_night_auto_off_ms: "60000"

  # Transient overlay durations (LED-07/LED-08) — provisional.
  led_identify_ms: "4000"
  led_status_ms: "1500"

  # Optional-input capability flags (LED-FRAMEWORK-002). Compile-time facts:
  # is the RoomIQ (darkness) framework composed? the Presence (occupancy)
  # framework? They default FALSE so the LED framework composes and degrades
  # cleanly on a Core+LED (or Core+AirIQ+LED) device with no RoomIQ and no
  # Presence — the automatic Night Mode Behaviours that need those inputs are
  # honestly downgraded to Manual rather than inventing darkness/occupancy.
  # A composition that actually includes RoomIQ / Presence overrides the
  # matching flag to "true":
  #   * RoomIQ  → set led_has_roomiq: "true" (the darkness decision then
  #               reflects the real calibrated illuminance path).
  #   * Presence→ set led_has_presence: "true" AND compose
  #               packages/features/led_presence_bridge.yaml (the ONLY place
  #               the fused Occupancy entity is referenced — so the LED
  #               framework itself never hard-references a Presence id that a
  #               Presence-less device would not define).
  # These flow into the sense360_led component block below as booleans, so
  # no reference to a missing RoomIQ/Presence id is ever compiled.
  led_has_roomiq: "false"
  led_has_presence: "false"

# ----------------------------------------------------------------------------
# The LED domain component (SENSE360-CANONICALISATION-001 PR 12) — engine
# configuration, the darkness service read, customer-intent arbitration, the
# arbitrated light apply, the 250 ms tick and the diagnostics switchboard.
# The customer controls stay the persisted template entities below, bound by
# id; `led_max_brightness_pct` is owned by the LED board package.
# ----------------------------------------------------------------------------
sense360_led:
  id: s360_led_component
  light_id: led_ring
  night_behaviour_select: s360_led_night_behaviour
  status_indicator_select: s360_led_status_indicator
  darkness_threshold_number: s360_led_darkness_threshold
  max_brightness_pct: ${led_max_brightness_pct}
  night_brightness_pct: ${led_night_brightness_pct}
  night_red: ${led_night_red}
  night_green: ${led_night_green}
  night_blue: ${led_night_blue}
  darkness_hysteresis: ${led_darkness_hysteresis}
  night_auto_off: ${led_night_auto_off_ms}ms
  identify_duration: ${led_identify_ms}ms
  status_duration: ${led_status_ms}ms
  has_roomiq: ${led_has_roomiq}
  has_presence: ${led_has_presence}

esphome:
  # LIST FORM IS LOAD-BEARING (STATIC-DIAGNOSTIC-PUBLISH-001). This block was
  # previously written as a MAPPING (`on_boot:` -> `priority:` / `then:`).
  # ESPHome's package merging uses esphome.config_helpers.merge_config, which
  # REPLACES rather than merges when a mapping meets a list — so in every
  # composition where another package declares a list-form `on_boot:` this
  # hook was silently deleted and the persisted-state restore below never ran.
  # Written as a list, boot hooks concatenate across packages as intended.
  on_boot:
    # Compile-time honesty companion: never polled, so it is published once at
    # boot. Independent of the restore hook below.
    - priority: 500
      then:
        - component.update: s360_led_output_verification
    # Late boot hook (after components are set up and restored globals are
    # loaded): re-apply the persisted stable customer state (LED-11). The
    # light itself boots ALWAYS_OFF, so an interrupted transient overlay is
    # never replayed; safe-mode boots run a minimal config without this
    # package, leaving the ring off. Opening the component's boot gate
    # (mark_booted) AFTER the restore means no evaluation ever runs against
    # unrestored state.
    - priority: -100
      then:
        - lambda: |-
            using namespace sense360::ledfw;
            auto &controller = global_controller();
            sense360::ledfw::LightState saved;
            saved.on = id(s360_led_saved_on);
            saved.brightness = id(s360_led_saved_brightness);
            saved.red = id(s360_led_saved_r);
            saved.green = id(s360_led_saved_g);
            saved.blue = id(s360_led_saved_b);
            saved.effect = (uint8_t) id(s360_led_saved_effect);
            controller.restore(saved, id(s360_led_night_on),
                               id(s360_led_night_auto));
            // Brief startup indication (Essential level, LED-06) — shown only
            // when nothing higher-priority owns the ring.
            controller.notify_status(millis(), EVENT_STARTUP);
            id(s360_led_component).mark_booted();
        - script.execute: s360_led_evaluate

# Status events come from REAL supported signals only (LED-06): the Home
# Assistant API connection (Essential) and WiFi connectivity (Detailed).
# These trigger blocks merge with the base packages' api:/wifi: config.
api:
  on_client_connected:
    - lambda: |-
        sense360::ledfw::global_controller().notify_status(
            millis(), sense360::ledfw::EVENT_CONNECTED);
    - script.execute: s360_led_evaluate
  on_client_disconnected:
    - lambda: |-
        sense360::ledfw::global_controller().notify_status(
            millis(), sense360::ledfw::EVENT_WARNING);
    - script.execute: s360_led_evaluate

wifi:
  on_connect:
    - lambda: |-
        sense360::ledfw::global_controller().notify_status(
            millis(), sense360::ledfw::EVENT_DETAIL_INFO);
    - script.execute: s360_led_evaluate
  on_disconnect:
    - lambda: |-
        sense360::ledfw::global_controller().notify_status(
            millis(), sense360::ledfw::EVENT_DETAIL_WARNING);
    - script.execute: s360_led_evaluate

globals:
  # Restore contract (LED-11): ONLY the stable customer state and Night Mode
  # ownership persist across restart. Transient overlays (identify/status)
  # are RAM-only by design and can never survive a reboot. These globals'
  # NVS restore identity is a protected contract — the ids and types never
  # change. The former RAM-only occupancy copies (s360_led_occupied /
  # s360_led_occupancy_valid) were retired by SENSE360-CANONICALISATION-001
  # PR 12: the presence bridge now feeds the controller's occupancy input
  # directly — same fused signal, one hop earlier.
  - id: s360_led_saved_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: s360_led_saved_brightness
    type: float
    restore_value: true
    initial_value: '0.5'
  - id: s360_led_saved_r
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: s360_led_saved_g
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: s360_led_saved_b
    type: float
    restore_value: true
    initial_value: '1.0'
  - id: s360_led_saved_effect
    type: int
    restore_value: true
    initial_value: '0'
  - id: s360_led_night_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: s360_led_night_auto
    type: bool
    restore_value: true
    initial_value: 'false'

# ----------------------------------------------------------------------------
# Evaluation bridge — the component owns the 250 ms tick and every
# input/output exchange with the engine; this same-id script is the
# documented re-evaluation hook for the boot restore, the api/wifi status
# notifies, the night-mode switch, the identify button and the presence
# bridge, so external feeders keep one stable entrypoint.
# ----------------------------------------------------------------------------
script:
  - id: s360_led_evaluate
    then:
      - lambda: |-
          id(s360_led_component).evaluate();

interval:
  # Persist the stable customer state (LED-11): an idempotent 1 s mirror of
  # the engine's arbitrated customer truth into the restore globals — the
  # same values the retired in-evaluate writes produced, at the same NVS
  # save cadence (globals only flash on change). Transients are never
  # written; the component's boot gate keeps unrestored state from ever
  # overwriting a persisted one.
  - interval: 1s
    then:
      - lambda: |-
          if (!id(s360_led_component).booted()) return;
          auto &controller = sense360::ledfw::global_controller();
          const sense360::ledfw::LightState &customer = controller.customer_state();
          id(s360_led_saved_on) = customer.on;
          id(s360_led_saved_brightness) = customer.brightness;
          id(s360_led_saved_r) = customer.red;
          id(s360_led_saved_g) = customer.green;
          id(s360_led_saved_b) = customer.blue;
          id(s360_led_saved_effect) = (int) customer.effect;
          id(s360_led_night_on) = controller.night_mode();
          id(s360_led_night_auto) = controller.night_automation_owned();

# ----------------------------------------------------------------------------
# Customer entities (the default-enabled set, LED-12). The Room Light itself
# is defined by the board package.
# ----------------------------------------------------------------------------
switch:
  # LED-02 — Night Mode. State is engine truth (lambda-polled), so
  # customer-, automation- and restore-driven changes stay in sync without
  # publish races. Turning it off restores the previous customer light
  # state; the customer's normal settings are never overwritten.
  - platform: template
    id: s360_led_night_mode
    name: "Night Mode"
    icon: mdi:weather-night
    lambda: |-
      return sense360::ledfw::global_controller().night_mode();
    turn_on_action:
      - lambda: |-
          sense360::ledfw::global_controller().set_night_mode(
              millis(), true, false);
      - script.execute: s360_led_evaluate
    turn_off_action:
      - lambda: |-
          sense360::ledfw::global_controller().set_night_mode(
              millis(), false, false);
      - script.execute: s360_led_evaluate

select:
  # LED-03 — Night Mode Behaviour. Default Manual (automation is opt-in).
  # "Scheduled" is deferred until a genuinely reliable local time source
  # exists (see the package header).
  #
  # The full option list is always offered (ESPHome select options cannot be
  # made conditional per composition without a customer-visible compromise —
  # reworking the entity id per build would break restore and Home Assistant
  # history). Honesty is enforced downstream instead (LED-FRAMEWORK-002): the
  # engine downgrades any mode whose required framework is absent to Manual,
  # the "LED Night Mode Behaviour" diagnostic states which input is missing,
  # and Night Mode never engages — so an unsupported mode is never silently
  # pretended active. Available per composition:
  #   * Core+LED / Core+AirIQ+LED     : Manual
  #   * Core+RoomIQ+LED               : Manual, When dark
  #   * Core+RoomIQ+Presence+LED      : Manual, When dark, When dark and occupied
  # The component binds this entity and re-evaluates on change.
  - platform: template
    id: s360_led_night_behaviour
    name: "Night Mode Behaviour"
    icon: mdi:tune-variant
    entity_category: config
    options:
      - "Manual"
      - "When dark"
      - "When dark and occupied"
    initial_option: "Manual"
    optimistic: true
    restore_value: true

  # LED-06 — Status Indicator. Essential by default: brief startup,
  # Home Assistant connection and recoverable-warning indications only.
  # Detailed adds network-level events. Off silences all indications
  # (Identify remains available — it is owner-requested, not a status).
  # The component binds this entity and re-evaluates on change.
  - platform: template
    id: s360_led_status_indicator
    name: "Status Indicator"
    icon: mdi:information-outline
    entity_category: config
    options:
      - "Off"
      - "Essential"
      - "Detailed"
    initial_option: "Essential"
    optimistic: true
    restore_value: true

number:
  # LED-05 — Darkness Threshold (lux). Below this the room counts as dark
  # (hysteresis: not-dark above threshold * 1.5). Values are provisional
  # pending bench validation of the lux path. The component binds this
  # entity and re-evaluates on change.
  - platform: template
    id: s360_led_darkness_threshold
    name: "Darkness Threshold"
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "lx"
    mode: box
    min_value: 1
    max_value: 200
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true

button:
  # LED-08 — Identify Device: a short, recognisable, non-disruptive pulse
  # that automatically restores the previous state. Local-only; useful for
  # installers and homes with several devices.
  - platform: template
    id: s360_led_identify
    name: "Identify Device"
    icon: mdi:crosshairs-gps
    on_press:
      then:
        - lambda: |-
            sense360::ledfw::global_controller().request_identify(millis());
        - script.execute: s360_led_evaluate

# ----------------------------------------------------------------------------
# Diagnostics (diagnostic + disabled by default — LED-12). The four runtime
# diagnostics are component-owned outputs (published on change by the
# sense360_led switchboard); the static honesty companion stays a template
# entity published once at boot.
# ----------------------------------------------------------------------------
text_sensor:
  # Which priority layer currently owns the ring (Fault / Identify /
  # Night Mode / Room Light / Status).
  - platform: sense360_led
    type: active_layer
    id: s360_led_active_layer
    name: "LED Active Layer"
    icon: mdi:layers-triple-outline
    entity_category: diagnostic
    disabled_by_default: true

  # Last status event the engine saw, with "(suppressed)" when the priority
  # rules or the Status Indicator level kept it off the ring.
  - platform: sense360_led
    type: last_status_event
    id: s360_led_last_status_event
    name: "LED Last Status Event"
    icon: mdi:message-alert-outline
    entity_category: diagnostic
    disabled_by_default: true

  # Raw darkness decision (Dark / Not dark / Unknown). Unknown means
  # missing, invalid or stale lux — deliberately distinct from darkness.
  # On a device without RoomIQ this stays "Unknown" (no lux is ever fed to the
  # shared engine); darkness is never invented.
  - platform: sense360_led
    type: darkness_state
    id: s360_led_darkness_state
    name: "LED Darkness State"
    icon: mdi:theme-light-dark
    entity_category: diagnostic
    disabled_by_default: true

  # Honest Night Mode Behaviour status (LED-FRAMEWORK-002): "OK" when the
  # selected mode is supported by this composition, otherwise which absent
  # framework (RoomIQ / Presence) forced the Manual fallback. States on-device
  # that an automatic mode is not active — never silently pretended.
  - platform: sense360_led
    type: night_behaviour_status
    id: s360_led_night_behaviour_status
    name: "LED Night Mode Behaviour"
    icon: mdi:tune-variant
    entity_category: diagnostic
    disabled_by_default: true

  # Honesty companion: states on-device why no runtime LED health is
  # reported — the module status "Included" is compile-time presence only.
  - platform: template
    id: s360_led_output_verification
    name: "LED Output Verification"
    icon: mdi:shield-search
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never
    lambda: |-
      return {"WS2812B data line is one-way; firmware cannot verify emitted light"};
