# ============================================================================
# SENSE360 PRESENCE FRAMEWORK — fusion + customer entity + module-health layer
# ============================================================================
# PRESENCE-FRAMEWORK-001 (docs/architecture/sense360-presence-framework.md).
#
# One coherent customer occupancy capability fused from the three RoomIQ
# presence sensors — the customer never needs to know which sensor produced
# the result:
#   * PIR      — immediate movement response (adapter:
#                packages/boards/s360-200-roomiq-pir.yaml)
#   * LD2450   — movement, target tracking, radar target count (adapter:
#                packages/boards/s360-200-roomiq-radar.yaml)
#   * SEN0609  — static presence for still occupants (adapter:
#                packages/boards/s360-200-roomiq-sen0609.yaml)
#
# Customer-facing entities, by Home Assistant panel:
#   * default surface  — Occupancy. The one presence signal a customer sees
#                        without configuring anything.
#   * configuration    — Presence Mode · Clear Delay. Controls, not room
#                        signals; Home Assistant files them under Config.
#   * advanced, opt-in — Presence Status · Radar Target Count. Diagnostic
#                        and disabled by default while SOT OD-SOT-004
#                        leaves radar attachment inclusion unresolved (see
#                        the rationale at each entity below).
# Everything sensor-specific stays diagnostic and/or disabled by default.
# There is deliberately NO "Presence Sensitivity" (no honest common runtime
# sensitivity contract exists across the three sensors — modes first) and
# NO "People Count" (radar targets are not verified people, PD-09).
#
# The fusion state machine is the header-only engine
# components/sense360/presence_fusion.h — the SAME implementation exercised by
# the deterministic simulation tests (tests/unit/test_presence_fusion.cpp),
# so tested logic and shipped logic cannot drift. Since
# SENSE360-CANONICALISATION-001 PR 10 the glue that feeds and publishes that
# engine is the sense360_presence external component
# (components/sense360_presence/): input feeding, the runtime mode /
# clear-delay control interplay, the 500 ms evaluation tick and the
# publish-on-change switchboard live in component code instead of YAML
# lambdas, wrapping the SAME sense360::presence::global_engine() singleton.
# Fail-safe rules, status precedence, health rules and mode behaviour are
# documented in the architecture doc and pinned by
# tests/test_presence_framework.py.
#
# Module health: this package drives the Core-Framework "Presence Module
# Status" entity (s360_module_status_presence) with the reserved runtime
# vocabulary (Initialising / Available / Degraded / Unavailable / Fault)
# from a real supported signal — LD2450 frame-driven freshness — per the
# CORE-FRAMEWORK-001 extension rules (config/core-framework.json
# module_runtime_status.presence). GPIO-level sensors (PIR, SEN0609 digital
# out) cannot prove communication health and never fabricate it.
#
# Composition contract: bundles compose this package together with the
# three adapters above AND the shared Core Framework package under
# packages/base/ (owner of the Presence Module Status entity; this file
# deliberately does NOT include it — bundles compose it exactly once, per
# the CORE-FRAMEWORK-001 isolation rule). Expected-sensor membership is
# configuration-driven (PD-08): a future composition without a sensor
# overrides the presence_*_expected substitution — an intentionally absent
# sensor is never a fault.
#
# Timing values are engineering defaults pending bench validation
# (docs/hardware/presence-framework-bench-checklist.md). NO hardware,
# bench, compliance or commercial claim is made by this package.
# ============================================================================

substitutions:
  # Expected-sensor membership (PD-08) — configuration-driven; override per
  # composition. "true"/"false" literals injected into the fusion engine.
  presence_pir_expected: "true"
  presence_radar_expected: "true"
  presence_sen0609_expected: "true"

  # Sensor-specific startup windows (ms) — engineering defaults pending
  # bench validation (deliberately NOT one arbitrary shared value):
  #   * PIR: passive-infrared modules need tens of seconds to stabilise
  #     after power-on and emit false triggers meanwhile; edges inside the
  #     window are ignored.
  #   * LD2450: frames appear within seconds of boot; its first real frame
  #     ends its initialisation early.
  #   * SEN0609: mmWave self-check after power-on; levels inside the
  #     window are ignored.
  presence_pir_warmup_ms: "30000"
  presence_radar_warmup_ms: "10000"
  presence_sen0609_warmup_ms: "15000"

  # LD2450 frames arrive ~1/s (component throttle); no frame for this long
  # means the radar data is STALE (unknown — never interpreted as clear).
  presence_radar_stale_ms: "5000"

# ----------------------------------------------------------------------------
# The Presence domain component (sense360_presence, PR 10) — owns everything
# the retired evaluate lambda, interval and control on_value hooks owned:
# input feeding (PIR / SEN0609 edges plus radar frames from the bound radar
# sensors' real update callbacks), the PD-08 expected-sensor configuration,
# the PD-04/PD-10 mode / clear-delay interplay, the 500 ms tick and the
# publish-on-change switchboard. The engine headers are delivered by the
# auto-loaded sense360 foundation component (no local esphome: includes:
# needed); the former transient s360_presence_applying_mode global is an
# internal component member now (it was never customer-visible and never
# persisted).
# ----------------------------------------------------------------------------
sense360_presence:
  id: s360_presence_component
  pir_sensor: s360_pir_motion
  static_sensor: s360_sen0609_presence
  radar_target_count_sensor: ld2450_target_count
  radar_moving_count_sensor: ld2450_moving_target_count
  radar_still_count_sensor: ld2450_still_target_count
  mode_select: s360_presence_mode
  clear_delay_number: s360_presence_clear_delay
  # Owned by the Core Framework (CORE-FRAMEWORK-001); the component only
  # feeds it with the engine's LD2450-frame-driven health vocabulary.
  module_status_id: s360_module_status_presence
  pir_expected: ${presence_pir_expected}
  radar_expected: ${presence_radar_expected}
  static_expected: ${presence_sen0609_expected}
  pir_warmup: ${presence_pir_warmup_ms}ms
  radar_warmup: ${presence_radar_warmup_ms}ms
  static_warmup: ${presence_sen0609_warmup_ms}ms
  radar_stale: ${presence_radar_stale_ms}ms

esphome:
  # Compile-time health-contract honesty companion: never polled, so it is
  # published once at boot (STATIC-DIAGNOSTIC-PUBLISH-001). The runtime
  # module status is owned by the component's 500 ms tick, which only runs
  # after setup completes — the seed can never overwrite it.
  on_boot:
    - priority: 500
      then:
        - component.update: s360_presence_verification_limits

# ----------------------------------------------------------------------------
# Adapter re-evaluation bridge. The PIR and SEN0609 board adapters execute
# this script from on_press/on_release (their documented layering contract,
# unchanged by PR 10); it bridges into the component's single evaluate owner.
# Live glue, not a compatibility stub: the adapters are the reason it exists.
# ----------------------------------------------------------------------------
script:
  - id: s360_presence_evaluate
    then:
      - lambda: |-
          id(s360_presence_component).evaluate();

# ----------------------------------------------------------------------------
# Customer-facing entities. Occupancy is the default surface; Presence
# Status below is advanced and opt-in (see its rationale).
# ----------------------------------------------------------------------------
binary_sensor:
  # PD-01 — unified occupancy: any valid sensor asserts it; it clears only
  # when every currently usable sensor agrees the room is clear and the
  # clear delay has expired. Fail-safe: stale/unavailable data is unknown.
  # Component-owned since PR 10 (published on change by the switchboard).
  - platform: sense360_presence
    type: occupancy
    id: s360_occupancy
    name: "Occupancy"
    device_class: occupancy
    icon: mdi:home-account

  # Legacy compatibility entity (pre-framework customers automated on it).
  # Exact ID and name preserved so existing Home Assistant entity IDs keep
  # working; now driven by the fused occupancy result; disabled by default
  # for new installs (the customer surface above replaces it).
  - platform: template
    id: presence_binary
    name: "${friendly_name} Presence"
    device_class: occupancy
    disabled_by_default: true
    lambda: |-
      return id(s360_occupancy).state;

text_sensor:
  # Health-contract honesty (audit Option A): states in plain words which
  # sensors carry a real health signal, so the module status "Available"
  # can never silently be read as "all three sensors physically healthy".
  # Compile-time composition fact; diagnostic, disabled by default.
  - platform: template
    id: s360_presence_verification_limits
    name: "Presence Sensor Verification"
    icon: mdi:shield-search
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never
    lambda: |-
      return {"Radar (LD2450) UART verifiable; PIR and SEN0609 GPIO carry no health signal"};

  # PD-02 — customer presence story in one value. Precedence (documented in
  # the architecture doc, tested in tests/unit/test_presence_fusion.cpp):
  # Unavailable > Initialising > Multiple targets > Movement detected >
  # Still presence > Sensor degraded > Clear. Customer-clarity decision:
  # while the room is occupied the status keeps showing activity and the
  # (diagnostic) Presence Module Status carries any degradation.
  # Diagnostic and disabled by default under SENSE360-REVIEW-RELEASE-001
  # Gate B, for the same reason as Radar Target Count: SOT OD-SOT-004 leaves
  # radar attachment inclusion unresolved, so the canonical package expects
  # radar (presence_radar_expected: "true"). On a unit whose radar connector
  # is unpopulated the radar channel is expected AND verifiable, so past its
  # warm-up it counts as FAILED; PIR keeps the module usable, so health sits
  # at Degraded permanently. PD-02 precedence puts HEALTH_DEGRADED above
  # STATUS_CLEAR, so with the room genuinely empty this entity reads
  # "Sensor degraded" and never "Clear".
  #
  # Proven, not inferred: tests/unit/test_presence_fusion.cpp
  # missing_radar_reports_degraded_not_clear_when_room_empties drives the
  # shared engine with no radar frames and asserts exactly that.
  #
  # Occupancy stays on the customer default surface because it stays correct
  # throughout (occupancy_remains_trustworthy_across_the_degraded_cycle).
  # The fusion, precedence and health logic are entirely unchanged — this is
  # presentation only, and it asserts nothing about whether radar ships.
  # Changing presence_radar_expected instead would resolve OD-SOT-004 by
  # inference in one direction or the other, which is forbidden.
  - platform: sense360_presence
    type: presence_status
    id: s360_presence_status
    name: "Presence Status"
    icon: mdi:motion-sensor
    entity_category: diagnostic
    disabled_by_default: true

sensor:
  # PD-09 — "Radar Target Count", never "People Count": radar targets are
  # not verified people. Dimensionless instantaneous count (no unit that
  # could imply cumulative measurement); unknown (NAN) while radar data is
  # stale rather than a fake 0.
  # Diagnostic and disabled by default under SENSE360-REVIEW-RELEASE-001
  # Gate B: whether the connector-attached radar modules are supplied is
  # SOT OD-SOT-004, still open. Every other radar-derived entity in this
  # framework is already diagnostic + disabled by default; this one was the
  # sole exception, so this restores consistency rather than setting new
  # policy. It asserts nothing about whether radar ships and resolves no
  # owner decision. Occupancy stays on the customer default surface: PD-01
  # fusion asserts from ANY valid sensor, so it remains meaningful on the
  # PCB-mounted PIR alone. Presence Status does NOT — with radar expected
  # but unpopulated it reports "Sensor degraded" rather than "Clear", so it
  # is gated the same way as this entity.
  - platform: sense360_presence
    type: radar_target_count
    id: s360_radar_target_count
    name: "Radar Target Count"
    entity_category: diagnostic
    disabled_by_default: true
    icon: mdi:radar
    state_class: measurement
    accuracy_decimals: 0

  # Legacy compatibility entity (pre-framework "Presence Score"). Driven by
  # the fused result with documented values: 100 while occupied, 0 while
  # clear — a state indicator, NOT a probability (the old synthetic
  # confidence tiers were removed). Disabled by default for new installs.
  - platform: template
    id: presence_score
    name: "${friendly_name} Presence Score"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      return id(s360_occupancy).state ? 100.0f : 0.0f;

  # Technical stale-data timer — diagnostic, disabled by default.
  - platform: template
    id: s360_radar_data_age
    name: "Radar Data Age"
    icon: mdi:timer-alert-outline
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      if (!id(s360_radar_frame_seen)) return NAN;
      return (millis() - id(s360_radar_last_frame_ms)) / 1000.0f;

# PD-10 — customer modes. Presets change ONLY documented, genuinely
# runtime-configurable fusion settings (clear-delay preset, PIR movement
# hold, degraded fallback — see mode_params() in the shared header). No
# unsupported dynamic sensor commands are issued; per-sensor thresholds
# remain future tuning (documented).
select:
  - platform: template
    id: s360_presence_mode
    name: "Presence Mode"
    icon: mdi:tune-variant
    entity_category: config
    options:
      - "Balanced"
      - "Responsive"
      - "Stable"
      - "Custom"
    initial_option: "Balanced"
    optimistic: true
    restore_value: true
    # Preset application (and the guard against bouncing the mode to
    # Custom) moved into the sense360_presence component, which subscribes
    # to this select's state callbacks (PD-10 semantics unchanged).

# PD-04 — Home-Assistant-adjustable clear delay: safe customer bounds,
# persisted across reboot (restore_value), applied at runtime by the next
# fusion evaluation — changing it never requires recompilation.
number:
  - platform: template
    id: s360_presence_clear_delay
    name: "Clear Delay"
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: "s"
    mode: box
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    # The manual-edit-switches-to-Custom rule (PD-10) moved into the
    # sense360_presence component, which subscribes to this number's state
    # callbacks and re-evaluates immediately (PD-04 semantics unchanged).
