# ============================================================================
# SENSE360 BLOWER FRAMEWORK — enclosure circulation-fan experience
# ============================================================================
# BLOWER-FRAMEWORK-001 (docs/architecture/sense360-blower-framework.md).
#
# Purpose (owner decision, 2026-07-31): the Core's dedicated on-board FAN net
# (the two-wire binary 5 V blower on J13) is an ENCLOSURE AIR CIRCULATION fan.
# It moves room air through the Sense360 enclosure so the on-board sensors
# sample representative air. It is NOT a room-ventilation output and no
# room-air-change effect is claimed. The customer never needs to know about
# GPIOs, MOSFETs or the AirIQ engine:
#
#   * Circulation Fan Mode  — Off / Auto / On (default Auto). This is the
#                             AUTHORITATIVE customer control:
#                               - Off  : always command the fan off.
#                               - Auto : periodic duty-cycle circulation (run /
#                                        rest, substitution-tunable), boosted
#                                        to continuous while the canonical
#                                        AirIQ demand is at/above the boost
#                                        trigger.
#                               - On   : always command the fan on.
#   * Circulation Boost Trigger — Ventilate now / Ventilate soon: the AirIQ
#                             demand level at which Auto boosts to continuous
#                             circulation (conservative default: only
#                             "Ventilate now").
#   * Circulation Fan       — a READ-ONLY binary sensor showing the commanded
#                             fan state (on/off). There is deliberately NO
#                             customer on/off toggle and NO speed control: the
#                             mode is the single control, so nothing can
#                             transiently contradict the selected mode.
#
# Hardware contract (verified against docs/hardware/s360-100-r4-core.md and the
# owner-provided S360-100-R4 schematic; this framework encodes NO more than the
# contract proves):
#   * The fan is the Core's dedicated `FAN` net: schematic `IO21` (GPIO21)
#     drives Q4 (SI2302S low-side MOSFET) switching the 5 V blower on J13.
#     J13 is a two-wire binary 5 V output (pins: +5V, FAN, GND).
#   * There is NO J13 tach, speed-PWM, current, airflow or physical-rotation
#     feedback. This framework commands ONLY on/off and NEVER reports, infers or
#     claims fan speed, airflow, current or rotation. The FAN net is a one-way
#     drive — firmware can never verify the fan physically spun (the
#     "Circulation Fan Output Verification" diagnostic states this on-device).
#   * `GPIO46` (`GP_Fan_Status_Led`) is a Core-side status indicator owned by
#     the Core board package and is NEVER treated as rotation feedback — this
#     framework does not touch it. The generic `GPIO3` relay (J4) is a SEPARATE
#     control owned by the Core board package (`main_relay`) and is likewise
#     never part of the fan path — this framework does not touch it.
#
# Boot safety: the FAN-net GPIO output boots OFF (gpio output default). The
# persisted Circulation Fan Mode is restored during component setup and applied
# by the late (priority -100) on_boot evaluation, so the output is safely off
# until the restored mode is evaluated. Mode is persisted (restore_value) and
# defaults to Auto on first boot.
#
# Optional input (AirIQ). The canonical AirIQ air-quality service is NOT a hard
# dependency. The base duty cycle is deliberately INDEPENDENT of AirIQ —
# circulation is an enclosure-sampling function, not a response to air quality
# — so Auto circulates with or without AirIQ composed. When AirIQ IS composed,
# a demand at/above the boost trigger switches Auto to continuous circulation
# so sampling stays fresh while air quality is changing. A missing /
# initialising / unavailable AirIQ demand is UNKNOWN and NEVER boosts the fan —
# missing air-quality data never changes the fan's behaviour. One compile-time
# flag declares what is present:
#   * blower_has_airiq — is the AirIQ framework (AIRIQ-FRAMEWORK-001) composed?
#                        Default "false".
#
# Auto duty cycle (all windows PROVISIONAL, substitution-tunable):
#   * Entering Auto starts a circulation run immediately, then the cycle
#     repeats: on for blower_circulate_on_ms, off for blower_circulate_off_ms.
#   * While a real AirIQ demand is at/above the boost trigger the fan runs
#     continuously; when the boost ends the cycle resumes with a full rest
#     period (the fan has just been running).
#
# Demand contract: this framework reads the canonical AirIQ demand contract
# through the SHARED header-only engine singleton
# `sense360::airiq::global_engine().recommendation()` — never a hard `id()` to
# an AirIQ entity, and it NEVER duplicates pollutant thresholds (the AirIQ
# engine owns pollutant truth). The AirIQ engine header is compiled here
# unconditionally (idempotent under `#pragma once`) so the demand read compiles
# with or without the AirIQ framework; when absent the engine is simply unfed,
# so its recommendation stays "Sensor initialising" -> UNKNOWN demand.
#
# The fan behaviour is implemented in the header-only engine
# components/sense360/blower_controller.h — the SAME implementation exercised by
# the deterministic simulation tests (tests/unit/test_blower_controller.cpp and
# tests/unit/test_blower_airiq_coexist.cpp), so tested logic and shipped logic
# cannot drift. The contract is pinned by tests/test_blower_framework.py.
#
# Composition contract: only a device that explicitly composes this package
# gets a circulation-fan output. It is NEVER part of Release-One or any stable
# build — the blower is a fan output and the "Fans are never stable" standing
# gate (docs/standing-invariants.md) applies unchanged: this framework ships
# compile-only, with no config/webflash-builds.json row and no artifact.
#
# Every timing value below is a PROVISIONAL, software-defined engineering
# default pending bench validation
# (docs/hardware/blower-framework-bench-checklist.md). NO hardware, bench,
# airflow, electrical-safety, thermal, compliance or commercial claim is made
# by this package.
# ============================================================================

substitutions:
  # The Core's dedicated FAN net: schematic IO21 -> Q4 SI2302S -> J13
  # (S360-100-R4). Overridable only for a future board revision; the default is
  # the verified R4 pin.
  blower_fan_pin: GPIO21

  # Compile-time composition capability (BLOWER-FRAMEWORK-001): is the canonical
  # AirIQ air-quality service composed? It defaults FALSE so the framework
  # composes cleanly on a device with no AirIQ — Auto then runs the base duty
  # cycle with no boost (fail-safe: no demand is ever invented). A composition
  # that includes AIRIQ-FRAMEWORK-001 overrides this to "true". It substitutes
  # straight into the engine as a C++ bool literal, so no reference to a
  # missing AirIQ id is ever compiled.
  blower_has_airiq: "false"

  # Auto duty-cycle windows (ms) — PROVISIONAL engineering defaults pending
  # bench validation: run 1 minute, rest 4 minutes (a 20% duty cycle). The run
  # keeps enclosure air representative for the sensors; the rest limits noise
  # and fan wear.
  blower_circulate_on_ms: "60000"
  blower_circulate_off_ms: "240000"

# The circulation-fan controller engine is compiled from the shared header
# (single implementation; see tests/unit/test_blower_controller.cpp). The
# canonical AirIQ engine is compiled here too so the demand read below resolves
# whether or not the AirIQ framework is composed (with no AirIQ input the
# engine reports "Sensor initialising" -> UNKNOWN demand — it never invents
# demand). Paths are relative to the products/ config dir; remote consumers use
# packages/remote/ceiling-blower.yaml, which replaces this include with the
# sense360 external component.
esphome:
  includes:
    - ../components/sense360/blower_controller.h
    - ../components/sense360/airiq_engine.h
  on_boot:
    # Publish the static "Circulation Fan Output Verification" string once at
    # boot (that text sensor uses update_interval: never, so it is not polled).
    # Priority 500 is the repository-wide static-diagnostic publication point
    # (STATIC-DIAGNOSTIC-PUBLISH-001); the string is immutable, so moving it
    # off the late hook below changes nothing except when it appears.
    - priority: 500
      then:
        - component.update: s360_blower_output_verification
    # Late boot hook (after components are set up and the persisted mode is
    # restored): initialise the controller clock and apply the restored mode.
    # The FAN-net GPIO output boots OFF, so it is safely off until this runs.
    - priority: -100
      then:
        - lambda: |-
            sense360::blower::global_controller().begin(millis());
        - script.execute: s360_blower_evaluate

# ----------------------------------------------------------------------------
# Fan output (the FAN net). Binary GPIO drive of schematic IO21 -> Q4
# SI2302S -> J13. Boots OFF; driven only by the engine via s360_blower_evaluate.
# ----------------------------------------------------------------------------
output:
  - platform: gpio
    id: blower_output
    pin: ${blower_fan_pin}

# ----------------------------------------------------------------------------
# Evaluation — periodic tick plus immediate re-evaluation on customer actions.
# One script owns every input/output exchange with the engine, so scripts and
# automations cannot race each other.
# ----------------------------------------------------------------------------
script:
  - id: s360_blower_evaluate
    then:
      - lambda: |-
          using namespace sense360::blower;
          auto &controller = global_controller();
          const uint32_t now = millis();

          // Compile-time composition capability (BLOWER-FRAMEWORK-001): the flag
          // substitutes in as a C++ bool literal, so no reference to an absent
          // AirIQ id is ever compiled. Without AirIQ there is never an
          // air-quality boost; the base duty cycle is unaffected.
          controller.set_has_airiq(${blower_has_airiq});

          // Customer controls (no recompilation needed for these values).
          controller.set_mode(mode_from_string(
              id(s360_blower_mode).current_option().c_str()));
          controller.set_trigger(trigger_from_string(
              id(s360_blower_auto_trigger).current_option().c_str()));
          controller.set_circulate_on_ms(${blower_circulate_on_ms});
          controller.set_circulate_off_ms(${blower_circulate_off_ms});

          // Canonical AirIQ demand (AIRIQ-FRAMEWORK-001). The AirIQ engine
          // singleton always resolves (its header is compiled here); when the
          // AirIQ framework is NOT composed it is simply unfed, so its
          // recommendation stays "Sensor initialising" -> UNKNOWN demand and
          // the fan is never boosted from missing data. No pollutant threshold
          // is duplicated here — the AirIQ engine owns pollutant truth.
          Demand demand = demand_from_airiq_recommendation(
              (int) sense360::airiq::global_engine().recommendation());
          controller.input_demand(now, demand);

          controller.evaluate(now);

          // Apply the engine's commanded output to the FAN-net GPIO. The engine
          // owns the output in every mode, so there is no customer toggle that
          // can contradict the selected Circulation Fan Mode.
          if (controller.output_on()) {
            id(blower_output).turn_on();
          } else {
            id(blower_output).turn_off();
          }

          // Diagnostics (publish on change only).
          {
            std::string status = controller.status_string();
            if (id(s360_blower_status).state != status) {
              id(s360_blower_status).publish_state(status);
            }
            std::string demand_text = demand_to_string(controller.demand());
            if (id(s360_blower_demand).state != demand_text) {
              id(s360_blower_demand).publish_state(demand_text);
            }
          }

interval:
  - interval: 1s
    then:
      - script.execute: s360_blower_evaluate

# ----------------------------------------------------------------------------
# Customer configuration entities.
# ----------------------------------------------------------------------------
select:
  # Circulation Fan Mode — the authoritative customer control. Default Auto
  # (the fan circulates automatically out of the box); persisted across
  # restart.
  - platform: template
    id: s360_blower_mode
    name: "Circulation Fan Mode"
    icon: mdi:fan-auto
    entity_category: config
    options:
      - "Off"
      - "Auto"
      - "On"
    initial_option: "Auto"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: s360_blower_evaluate

  # Circulation Boost Trigger. The AirIQ demand level at which Auto boosts to
  # continuous circulation. Conservative default: only "Ventilate now" (the
  # AirIQ Very-poor headline); "Ventilate soon" also boosts from the Poor
  # headline.
  - platform: template
    id: s360_blower_auto_trigger
    name: "Circulation Boost Trigger"
    icon: mdi:air-filter
    entity_category: config
    options:
      - "Ventilate now"
      - "Ventilate soon"
    initial_option: "Ventilate now"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: s360_blower_evaluate

# ----------------------------------------------------------------------------
# Customer state (read-only) + diagnostics.
# ----------------------------------------------------------------------------
binary_sensor:
  # Read-only commanded fan state (on/off). This is a representation of what
  # the engine commanded in the selected mode, NOT a controllable switch —
  # the customer controls the fan through Circulation Fan Mode.
  - platform: template
    id: blower_state
    name: "Circulation Fan"
    icon: mdi:fan
    lambda: |-
      return sense360::blower::global_controller().output_on();

  # Distinct air-quality boost indication (diagnostic).
  - platform: template
    id: s360_blower_boosting
    name: "Circulation Fan Boost"
    icon: mdi:weather-windy
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return sense360::blower::global_controller().boosting();

text_sensor:
  # What the circulation-fan control is doing, and why — including the duty
  # cycle run/rest phases and the air-quality boost state.
  - platform: template
    id: s360_blower_status
    name: "Circulation Fan Status"
    icon: mdi:fan-alert
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # The canonical AirIQ demand the boost is reading (Unknown / None /
  # Ventilate soon / Ventilate now). Unknown means missing / initialising /
  # AirIQ not composed — deliberately distinct from None and never a boost.
  - platform: template
    id: s360_blower_demand
    name: "Circulation Fan Air-Quality Demand"
    icon: mdi:weather-windy
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Honesty companion: states on-device why no runtime fan health / airflow /
  # speed is reported — the J13 FAN net is a one-way binary drive with no
  # feedback, so the fan's physical state is never verified.
  - platform: template
    id: s360_blower_output_verification
    name: "Circulation Fan Output Verification"
    icon: mdi:shield-search
    entity_category: diagnostic
    disabled_by_default: true
    # Static string, so it is not polled (update_interval: never); it is
    # published once at boot via `component.update` in the on_boot handler
    # above. Without that boot publish this lambda-only text sensor would never
    # run and would read "Unknown" when a user enables the entity.
    update_interval: never
    lambda: |-
      return {"J13 FAN net is a one-way binary 5V drive; no tach/speed/current/"
              "airflow/rotation feedback exists, so fan rotation is never "
              "verified. GPIO46 is a Core status LED, not rotation feedback; the "
              "GPIO3 relay is a separate control the fan never drives"};
