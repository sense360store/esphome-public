# ============================================================================
# SENSE360 ROOMIQ FRAMEWORK — canonical comfort and environmental service
# ============================================================================
# ROOMIQ-FRAMEWORK-001 (docs/architecture/sense360-roomiq-framework.md).
#
# One polished, simple customer environmental experience for the S360-200
# RoomIQ climate half — and the platform's single source of environmental
# truth. Other frameworks (LED today; VentIQ / AirIQ / Zones later) consume
# the canonical outputs below instead of re-reading raw sensors.
#
# Customer entities (enabled by default — the ONLY default-enabled set):
#   Temperature · Humidity · Illuminance · Comfort · Environment State ·
#   Brightness · Temperature Offset · Humidity Offset · Illuminance
#   Calibration
# Everything else stays diagnostic and/or disabled by default. There is
# deliberately NO customer-facing numeric comfort score (accepted owner
# decision: human-friendly states only; the legacy score entity remains as
# a disabled-by-default compatibility entity).
#
# The environmental model is the header-only engine
# include/sense360/roomiq_engine.h — the SAME implementation exercised by
# the deterministic simulation tests (tests/unit/test_roomiq_engine.cpp),
# so tested logic and shipped logic cannot drift. The contract is pinned by
# tests/test_roomiq_framework.py.
#
# Climate compensation (S360-200-R4-CLIMATE-COMPENSATION-001): the canonical
# Temperature and Humidity entities are FULLY COMPENSATED. The built-in,
# named board profile S360_200_R4_CLIMATE_PROFILE_V1 and the
# vapour-pressure-preserving psychrometric humidity model live in
# include/sense360/roomiq_climate_compensation.h — ONE implementation,
# consumed by the engine and by the native tests. Its constants and evidence
# posture are stated THERE and nowhere else: no constant and no formula is
# duplicated in this file, in a bundle, or in customer YAML, and the runtime
# diagnostics below read them from the compiled profile rather than restating
# them. The profile is a VALIDATED PROVISIONAL profile for the tested
# S360-200 R4 board: strong evidence for that board / enclosure /
# arrangement, never multi-unit, production, compliance or safety evidence.
#
# Calibration honesty: the customer offsets (temperature, humidity) and
# multiplier (illuminance) are ADDITIONAL fine calibration on top of the
# built-in factory profile, neutral at 0 / 0 / x1.0 and applied EXACTLY ONCE,
# inside the engine. Raw board sensors stay internal and uncompensated; every
# canonical output and every legacy compatibility entity carries the
# compensated value; no downstream framework applies its own offset. Values
# persist across restart via the number entities' restore_value; invalid
# stored values recover to neutral inside the engine. Because the humidity
# model recalculates relative humidity AT the corrected temperature, the
# customer temperature offset also moves humidity by a small, scientifically
# correct amount — that is the model working, not a double correction.
#
# Freshness honesty: a value is usable only after a real, valid (non-NaN)
# update callback inside the stale window. Stale channels publish unknown,
# never a frozen reading. Temperature and humidity come from one physical
# conversion of one physical sensor (SHT45 @ 0x44) surfaced through two
# ESPHome callbacks: humidity is marked fresh ONLY from a coherent pair
# (either callback order, bounded skew), and their shared failure shows
# honestly as both channels going stale together. Module health
# (Initialising / Available / Degraded / Unavailable) is driven from this
# real freshness evidence into
# the Core-Framework "RoomIQ Module Status" entity — the second wired
# module after Presence (config/core-framework.json
# module_runtime_status.roomiq). Fault is an engine contract with NO
# production producer (no composed component exposes a supported explicit
# fault signal today).
#
# Sensor-identity honesty: the hardware catalog / schematic / BOM document
# the S360-200 ambient-light sensor as LTR-303ALS-01. Under
# S360-200-R4-HARDWARE-RECONCILIATION-001 the compiled firmware now drives
# that exact part via ESPHome's built-in ltr_als_ps platform at its fixed
# I2C address 0x29 (the earlier VEML7700 @ 0x10 driver drift is removed), so
# the driver identity is RECONCILED to the schematic/BOM. Runtime confirmation
# that the sensor responds and produces valid lux on the board under test is
# still pending bench (the current I2C scan does not yet list 0x29 — a physical
# population/wiring question, not a firmware address error). This framework
# names the customer entity "Illuminance" (never a sensor model) and states the
# remaining limit in the RoomIQ Sensor Verification diagnostic.
#
# Composition contract: bundles compose this package together with the
# RoomIQ board package (packages/boards/s360-200-roomiq.yaml — owner of
# the raw internal sensors) AND the shared Core Framework package under
# packages/base/ (owner of the RoomIQ Module Status entity; this file
# deliberately does NOT include it — bundles compose it exactly once, per
# the CORE-FRAMEWORK-001 isolation rule). This package supersedes the
# legacy display profile packages/features/comfort_basic_profile.yaml in
# bundles (composing both would duplicate entities); legacy products keep
# the profile and its exact pre-framework behaviour.
#
# Every threshold below is a PROVISIONAL engineering default / comfort
# heuristic pending customer and bench validation
# (docs/hardware/roomiq-framework-bench-checklist.md). They are never
# medical, health, lighting-standard or regulatory claims. NO hardware,
# bench, compliance or commercial claim is made by this package.
# ============================================================================

substitutions:
  # Canonical input sources — overridable for future compositions.
  # Defaults are the authoritative raw sensors composed by every current
  # RoomIQ-bearing bundle (packages/boards/s360-200-roomiq-climate.yaml).
  roomiq_temperature_source_id: comfort_ceiling_temperature
  roomiq_humidity_source_id: comfort_ceiling_humidity
  roomiq_illuminance_source_id: comfort_ceiling_illuminance

  # Freshness windows (ms) — provisional engineering defaults pending
  # bench validation:
  #   * climate: the SHT4x publishes every 30 s; three missed updates
  #     (90 s) mean the data is stale. First data is expected within the
  #     60 s warm-up window.
  #   * illuminance: the compiled light path publishes every 10 s; 60 s
  #     without an update is stale (matches the pre-framework LED window).
  roomiq_climate_warmup_ms: "60000"
  roomiq_climate_stale_ms: "90000"
  roomiq_illuminance_warmup_ms: "30000"
  roomiq_illuminance_stale_ms: "60000"

  # Maximum accepted skew (ms) between the raw temperature and raw humidity
  # halves of ONE SHT45 conversion (S360-200-R4-CLIMATE-COMPENSATION-001).
  # ESPHome emits the two callbacks microseconds apart inside a single sht4x
  # poll, so 5 s is generous for a real pair while staying far below the 30 s
  # S360-200 R4 polling cycle — an old sample can never pair with the next
  # cycle's counterpart. Humidity is only marked fresh from a coherent pair.
  roomiq_climate_pair_skew_ms: "5000"

  # Persisted customer-calibration schema version. Bump ONLY when the meaning
  # of the stored customer offsets changes; see the migration block below.
  #   1 = pre-compensation raw offsets (customer corrected the whole board
  #       error by hand, e.g. -7.7 °C / +17 %RH)
  #   2 = additional fine calibration on top of the built-in
  #       S360_200_R4_CLIMATE_PROFILE_V1 factory compensation (neutral at 0)
  roomiq_calibration_schema_version: "2"

  # Comfort thresholds (°C / %RH) — PROVISIONAL comfort heuristics, not
  # medical/health thresholds. Advanced tuning is by substitution override
  # (documented), deliberately NOT one customer entity per threshold.
  roomiq_temp_cold_c: "16"
  roomiq_temp_cool_c: "18"
  roomiq_temp_warm_c: "24"
  roomiq_temp_hot_c: "27"
  roomiq_temp_hysteresis_c: "0.3"
  roomiq_humidity_dry_pct: "30"
  roomiq_humidity_humid_pct: "60"
  roomiq_humidity_hysteresis_pct: "2"

  # Brightness bands (lx) — PROVISIONAL room-ambience categories, not
  # lighting-standard compliance values. Falling transitions use a 20%
  # hysteresis margin so categories never flap at a boundary.
  roomiq_lux_dim_lx: "10"
  roomiq_lux_normal_lx: "50"
  roomiq_lux_bright_lx: "300"
  roomiq_lux_very_bright_lx: "1000"
  roomiq_brightness_hysteresis_pct: "20"

# The environmental engine is compiled from the shared header (single
# implementation; see tests/unit/test_roomiq_engine.cpp). Path is relative
# to the products/ config dir — the same pattern as
# packages/features/presence_framework.yaml.
esphome:
  includes:
    - ../include/sense360/roomiq_engine.h
    - ../include/sense360/roomiq_climate_compensation.h
  on_boot:
    # Compile-time honesty companion: never polled, so it is published once at
    # boot (STATIC-DIAGNOSTIC-PUBLISH-001). Runs before the engine hook below.
    - priority: 500
      then:
        - component.update: s360_roomiq_sensor_verification
    - priority: 250
      then:
        - lambda: |-
            sense360::roomiq::global_engine().begin(millis());
        - script.execute: s360_roomiq_evaluate
        - lambda: |-
            // Static support diagnostic: which built-in board climate
            // profile is compiled in, and exactly what it proves.
            const auto &profile =
                sense360::roomiq::global_engine().climate_profile();
            char buffer[200];
            snprintf(buffer, sizeof(buffer),
                     "%s (%s %s): temperature %+.2f C, humidity residual "
                     "%+.2f %%RH, evidence %s (one tested board; multi-unit "
                     "validation outstanding)",
                     profile.id, profile.board_sku, profile.board_revision,
                     profile.temperature_correction_c,
                     profile.humidity_residual_pct,
                     sense360::roomiq::climate_evidence_to_string(
                         profile.evidence));
            id(s360_roomiq_climate_profile).publish_state(buffer);

    # ------------------------------------------------------------------------
    # Persisted customer-calibration schema migration
    # (S360-200-R4-CLIMATE-COMPENSATION-001)
    # ------------------------------------------------------------------------
    # Firmware before the built-in compensation asked operators to correct the
    # WHOLE board error by hand through these controls (the S360-200 R4 bench
    # sheet said -7.7 °C and +17 %RH). Those persisted values would now
    # DOUBLE-CORRECT on top of the factory profile, so an upgrade must reset
    # customer calibration to neutral exactly once.
    #
    # The trigger is an explicit persisted schema marker, never a guess from
    # the stored numbers themselves (a legitimate -7.7 °C is indistinguishable
    # from a legacy one). Devices that have never stored the marker — an
    # upgrade from the old schema, or a clean install — read 0, get reset to
    # 0 / 0, and are stamped with the current version. Clean installs are
    # already 0 / 0, so the reset is a no-op for them. From then on the marker
    # matches, the migration never runs again, and customer values persist
    # normally. No factory reset is required.
    #
    # Priority 200 runs AFTER every HARDWARE-priority component has set up, so
    # the number entities have already restored their persisted values and
    # this really does overwrite the old ones.
    - priority: 200
      then:
        - if:
            condition:
              lambda: |-
                return id(s360_roomiq_calibration_schema) !=
                       ${roomiq_calibration_schema_version};
            then:
              - logger.log:
                  level: WARN
                  format: >-
                    RoomIQ calibration schema %d -> %d: resetting customer
                    Temperature/Humidity Offset to 0 once (built-in S360-200 R4
                    compensation now applies; pre-compensation manual offsets
                    would double-correct)
                  args:
                    - 'id(s360_roomiq_calibration_schema)'
                    - '${roomiq_calibration_schema_version}'
              - number.set:
                  id: s360_temperature_offset
                  value: 0
              - number.set:
                  id: s360_humidity_offset
                  value: 0
              - lambda: |-
                  id(s360_roomiq_calibration_schema) =
                      ${roomiq_calibration_schema_version};
                  id(s360_roomiq_calibration_schema_state).publish_state(
                      "v${roomiq_calibration_schema_version}: customer "
                      "calibration reset to 0/0 once for built-in "
                      "S360_200_R4_CLIMATE_PROFILE_V1 compensation");
            else:
              - lambda: |-
                  id(s360_roomiq_calibration_schema_state).publish_state(
                      "v${roomiq_calibration_schema_version}: no migration "
                      "needed; customer calibration persisted");

# ----------------------------------------------------------------------------
# Persisted calibration-schema marker (see the migration block above).
# ----------------------------------------------------------------------------
globals:
  - id: s360_roomiq_calibration_schema
    type: int
    restore_value: true
    initial_value: '0'

# ----------------------------------------------------------------------------
# Evaluation — periodic tick plus immediate re-evaluation on every real
# sensor update and every calibration change. One script owns every
# input/output exchange with the engine, so automations cannot race.
# ----------------------------------------------------------------------------
script:
  - id: s360_roomiq_evaluate
    then:
      - lambda: |-
          using namespace sense360::roomiq;
          auto &engine = global_engine();
          const uint32_t now = millis();

          // Freshness windows and provisional thresholds (substitutions).
          engine.set_climate_warmup_ms(${roomiq_climate_warmup_ms});
          engine.set_climate_stale_ms(${roomiq_climate_stale_ms});
          engine.set_lux_warmup_ms(${roomiq_illuminance_warmup_ms});
          engine.set_lux_stale_ms(${roomiq_illuminance_stale_ms});
          engine.set_temperature_bands(${roomiq_temp_cold_c},
                                       ${roomiq_temp_cool_c},
                                       ${roomiq_temp_warm_c},
                                       ${roomiq_temp_hot_c});
          engine.set_temperature_hysteresis(${roomiq_temp_hysteresis_c});
          engine.set_humidity_bands(${roomiq_humidity_dry_pct},
                                    ${roomiq_humidity_humid_pct});
          engine.set_humidity_hysteresis(${roomiq_humidity_hysteresis_pct});
          engine.set_brightness_bands(${roomiq_lux_dim_lx},
                                      ${roomiq_lux_normal_lx},
                                      ${roomiq_lux_bright_lx},
                                      ${roomiq_lux_very_bright_lx});
          engine.set_brightness_hysteresis_pct(
              ${roomiq_brightness_hysteresis_pct});

          // Sample coherence: the SHT45 temperature/humidity pair must come
          // from ONE physical conversion for the psychrometric humidity model
          // to mean anything.
          engine.set_climate_pair_skew_ms(${roomiq_climate_pair_skew_ms});

          // Customer calibration (runtime-adjustable; persisted by the
          // number entities; the engine clamps to safe bounds and treats
          // invalid values as neutral — calibration is applied EXACTLY
          // ONCE, here, on top of the built-in board profile).
          engine.set_temperature_offset(id(s360_temperature_offset).state);
          engine.set_humidity_offset(id(s360_humidity_offset).state);
          engine.set_illuminance_scale(id(s360_illuminance_scale).state);

          engine.evaluate(now);

          // Canonical numeric outputs — published from ONE place, on change
          // only. This single owner covers every trigger: a new sample, the
          // temperature callback that completes a humidity pair, a customer
          // calibration change while the raw pair is still fresh, and a
          // channel going stale (which publishes unknown, so a stale reading
          // is never left standing as if it were live).
          auto publish_changed = [](esphome::sensor::Sensor *target,
                                    float value) {
            const float current = target->state;
            const bool unchanged =
                (std::isnan(current) && std::isnan(value)) || current == value;
            if (!unchanged) target->publish_state(value);
          };
          publish_changed(id(s360_temperature), engine.temperature());
          publish_changed(id(s360_humidity), engine.humidity());
          publish_changed(id(s360_illuminance), engine.illuminance());

          // Factory-only support diagnostics: the built-in board profile
          // applied WITHOUT customer calibration, so support can separate
          // the two contributions without exposing formula internals.
          publish_changed(id(s360_roomiq_factory_temperature),
                          engine.factory_temperature());
          publish_changed(id(s360_roomiq_factory_humidity),
                          engine.factory_humidity());

          // Customer state outputs (publish on change only).
          {
            std::string value = comfort_to_string(engine.comfort());
            if (id(s360_comfort).state != value) {
              id(s360_comfort).publish_state(value);
            }
          }
          {
            std::string value = brightness_to_string(engine.brightness());
            if (id(s360_brightness).state != value) {
              id(s360_brightness).publish_state(value);
            }
          }
          {
            std::string value = environment_to_string(engine.environment());
            if (id(s360_environment_state).state != value) {
              id(s360_environment_state).publish_state(value);
            }
          }

          // Module health — real freshness evidence driving the
          // Core-Framework reserved runtime vocabulary (the second wired
          // module after Presence).
          {
            std::string health = health_to_string(engine.health());
            if (id(s360_module_status_roomiq).state != health) {
              id(s360_module_status_roomiq).publish_state(health);
            }
          }

          // Diagnostics (publish on change only).
          {
            char buffer[120];
            snprintf(buffer, sizeof(buffer),
                     "comfort=%s brightness=%s climate_fresh=%s light_fresh=%s",
                     comfort_to_string(engine.comfort()),
                     brightness_to_string(engine.brightness()),
                     (engine.temperature_fresh() && engine.humidity_fresh())
                         ? "yes"
                         : "no",
                     engine.illuminance_fresh() ? "yes" : "no");
            std::string detail = buffer;
            if (id(s360_roomiq_environment_detail).state != detail) {
              id(s360_roomiq_environment_detail).publish_state(detail);
            }
          }
          // Calibration diagnostic — states the FOUR contributions
          // separately so nobody has to guess which layer moved a reading:
          // the built-in factory profile, the customer temperature
          // calibration, the customer humidity calibration and the
          // illuminance calibration.
          {
            const auto &profile = engine.climate_profile();
            char buffer[220];
            snprintf(buffer, sizeof(buffer),
                     "factory %s %+.2f °C / %+.2f %%; customer temperature "
                     "%+.1f °C, customer humidity %+.1f %%, illuminance x%.2f",
                     profile.id, profile.temperature_correction_c,
                     profile.humidity_residual_pct, engine.temperature_offset(),
                     engine.humidity_offset(), engine.illuminance_scale());
            std::string calibration = buffer;
            if (id(s360_roomiq_calibration_state).state != calibration) {
              id(s360_roomiq_calibration_state).publish_state(calibration);
            }
          }

interval:
  - interval: 5s
    then:
      - script.execute: s360_roomiq_evaluate

# ----------------------------------------------------------------------------
# Sensor inputs (real update callbacks — the freshness signal) and the
# canonical calibrated customer sensors.
# ----------------------------------------------------------------------------
sensor:
  # --- input samples (internal) ---------------------------------------------
  # The freshness signal is the real update callback. Each handler feeds the
  # engine and re-evaluates; the evaluate script above is the SINGLE owner of
  # canonical publishing, so either SHT45 callback order publishes the right
  # values (a temperature sample that completes a humidity pair publishes
  # humidity too) with no duplicated publish logic here.
  - platform: copy
    source_id: ${roomiq_temperature_source_id}
    id: s360_roomiq_temperature_sample
    internal: true
    on_value:
      then:
        - lambda: |-
            sense360::roomiq::global_engine().input_temperature(millis(), x);
        - script.execute: s360_roomiq_evaluate

  - platform: copy
    source_id: ${roomiq_humidity_source_id}
    id: s360_roomiq_humidity_sample
    internal: true
    on_value:
      then:
        - lambda: |-
            sense360::roomiq::global_engine().input_humidity(millis(), x);
        - script.execute: s360_roomiq_evaluate

  # Illuminance is the noisiest channel: a short median window rejects
  # single-sample outliers with at most ~2 samples (~20 s) of added lag.
  # PROVISIONAL filter pending bench validation — deliberately small so
  # real light changes are not smoothed away.
  - platform: copy
    source_id: ${roomiq_illuminance_source_id}
    id: s360_roomiq_illuminance_sample
    internal: true
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            sense360::roomiq::global_engine().input_lux(millis(), x);
        - script.execute: s360_roomiq_evaluate

  # --- canonical compensated customer sensors ---------------------------------
  # Published from the engine whenever the value changes (and set unknown when
  # a channel goes stale). These are THE platform temperature / humidity /
  # illuminance values — fully compensated (built-in S360-200 R4 board profile
  # plus customer calibration): every other framework consumes these, never the
  # raw board sensors.
  - platform: template
    id: s360_temperature
    name: "Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer

  - platform: template
    id: s360_humidity
    name: "Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:water-percent

  - platform: template
    id: s360_illuminance
    name: "Illuminance"
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:brightness-5

  # --- diagnostics (diagnostic + disabled by default) --------------------------
  # Factory-compensated values: the built-in S360-200 R4 board profile applied
  # WITHOUT customer calibration. Support can subtract these from the canonical
  # entities to see exactly what the customer's own calibration contributed —
  # without exposing the intermediate stages of the formula as entities.
  - platform: template
    id: s360_roomiq_factory_temperature
    name: "Factory Compensated Temperature"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:thermometer-check
    update_interval: never

  - platform: template
    id: s360_roomiq_factory_humidity
    name: "Factory Compensated Humidity"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:water-check
    update_interval: never

  # Raw (uncompensated, uncalibrated) readings for support / calibration work.
  # These copy the board sensors directly and must never carry compensation.
  - platform: copy
    source_id: ${roomiq_temperature_source_id}
    id: s360_roomiq_raw_temperature
    name: "Raw Temperature"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2

  - platform: copy
    source_id: ${roomiq_humidity_source_id}
    id: s360_roomiq_raw_humidity
    name: "Raw Humidity"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1

  - platform: copy
    source_id: ${roomiq_illuminance_source_id}
    id: s360_roomiq_raw_illuminance
    name: "Raw Illuminance"
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "lx"
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 1

  # Seconds since the last valid update per channel (stale-data debugging).
  - platform: template
    id: s360_roomiq_climate_data_age
    name: "Climate Data Age"
    icon: mdi:timer-alert-outline
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 15s
    lambda: |-
      return sense360::roomiq::global_engine().climate_data_age_s(millis());

  - platform: template
    id: s360_roomiq_illuminance_data_age
    name: "Illuminance Data Age"
    icon: mdi:timer-alert-outline
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 15s
    lambda: |-
      return sense360::roomiq::global_engine().illuminance_data_age_s(millis());

  # --- legacy compatibility (pre-framework published entities) -----------------
  # Exact ids and names preserved so existing Home Assistant entity ids and
  # automations keep working. Disabled by default for new installs (the
  # canonical surface above replaces them); now driven by the CALIBRATED
  # canonical outputs and honest about missing data (documented semantic
  # upgrade — see the architecture doc's compatibility section).
  - platform: copy
    source_id: s360_temperature
    id: comfort_temperature_display
    name: "${friendly_name} RoomIQ Temperature"
    disabled_by_default: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: copy
    source_id: s360_humidity
    id: comfort_humidity_display
    name: "${friendly_name} RoomIQ Humidity"
    disabled_by_default: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: humidity
    state_class: measurement

  - platform: copy
    source_id: s360_illuminance
    id: comfort_light_display
    name: "${friendly_name} RoomIQ Light Level"
    disabled_by_default: true
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    device_class: illuminance
    state_class: measurement

  - platform: template
    id: comfort_feels_like
    name: "${friendly_name} RoomIQ Feels Like"
    disabled_by_default: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    update_interval: 30s
    lambda: |-
      return sense360::roomiq::global_engine().heat_index();

  # Legacy numeric score — compatibility only; never the customer surface
  # (accepted owner decision: human-friendly comfort states instead).
  - platform: template
    id: comfort_score_display
    name: "${friendly_name} RoomIQ Comfort Score"
    disabled_by_default: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:emoticon-happy-outline"
    update_interval: 30s
    lambda: |-
      return sense360::roomiq::global_engine().legacy_comfort_score();

# ----------------------------------------------------------------------------
# Customer state entities
# ----------------------------------------------------------------------------
text_sensor:
  # Concise comfort assessment from calibrated temperature and humidity
  # only (accepted owner decision). Values: Initialising / Comfortable /
  # Cool / Cold / Warm / Hot / Dry / Humid / Warm and humid / Unavailable.
  - platform: template
    id: s360_comfort
    name: "Comfort"
    icon: mdi:home-thermometer
    update_interval: never

  # ONE headline for the room. Never contradicts Comfort: climate
  # discomfort IS the headline; notable light conditions (Dark, or Bright
  # for the very-bright band) surface only when the climate is
  # comfortable — so it adds information instead of duplicating Comfort.
  - platform: template
    id: s360_environment_state
    name: "Environment State"
    icon: mdi:home-analytics
    update_interval: never

  # Human-friendly room-ambience category from calibrated illuminance:
  # Dark / Dim / Normal / Bright / Very bright (+ Initialising /
  # Unavailable), with hysteresis so it never flaps at a boundary.
  - platform: template
    id: s360_brightness
    name: "Brightness"
    icon: mdi:brightness-6
    update_interval: never

  # --- diagnostics (diagnostic + disabled by default) --------------------------
  # Why the current states are what they are (support / tuning aid).
  - platform: template
    id: s360_roomiq_environment_detail
    name: "RoomIQ State Detail"
    icon: mdi:text-search
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Active calibration values in one line (support / bench aid). Distinguishes
  # the built-in factory profile from each customer calibration control.
  - platform: template
    id: s360_roomiq_calibration_state
    name: "RoomIQ Calibration State"
    icon: mdi:tune-vertical
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Which built-in board climate profile is compiled in, with its constants
  # and — inseparably — the evidence level those constants actually reached.
  # Published once at boot (the profile is compile-time constant).
  - platform: template
    id: s360_roomiq_climate_profile
    name: "RoomIQ Climate Profile"
    icon: mdi:tune-variant
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Persisted customer-calibration schema version and whether this boot ran
  # the one-time reset (see the migration block at the top of this file).
  - platform: template
    id: s360_roomiq_calibration_schema_state
    name: "RoomIQ Calibration Schema"
    icon: mdi:database-sync
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Honesty companion: states on-device what the module status can and
  # cannot attest. The ambient-light driver identity is reconciled to the
  # schematic/BOM part (LTR-303ALS-01 @ 0x29 via ltr_als_ps); on-hardware
  # presence and measurement validity remain a bench item.
  - platform: template
    id: s360_roomiq_sensor_verification
    name: "RoomIQ Sensor Verification"
    icon: mdi:shield-search
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never
    lambda: |-
      return {"Freshness from I2C data updates only; light sensor is "
              "LTR-303ALS-01 @ 0x29 (schematic/BOM-matched) - on-hardware "
              "response pending bench"};

  # --- legacy compatibility text entities ---------------------------------------
  - platform: template
    id: comfort_status
    name: "${friendly_name} Comfort Status"
    icon: "mdi:home-thermometer"
    disabled_by_default: true
    update_interval: 30s
    lambda: |-
      return {sense360::roomiq::global_engine().legacy_comfort_status()};

  - platform: template
    id: comfort_light_status
    name: "${friendly_name} Light Status"
    icon: "mdi:brightness-6"
    disabled_by_default: true
    update_interval: 10s
    lambda: |-
      return {sense360::roomiq::global_engine().legacy_light_status()};

  - platform: template
    id: comfort_temp_advice
    name: "${friendly_name} Temperature Advice"
    icon: "mdi:thermometer-lines"
    disabled_by_default: true
    update_interval: 60s
    lambda: |-
      return {sense360::roomiq::global_engine().legacy_temperature_advice()};

  - platform: template
    id: comfort_humidity_advice
    name: "${friendly_name} Humidity Advice"
    icon: "mdi:water-percent"
    disabled_by_default: true
    update_interval: 60s
    lambda: |-
      return {sense360::roomiq::global_engine().legacy_humidity_advice()};

# ----------------------------------------------------------------------------
# Customer calibration controls (runtime, persisted, safe bounds)
# ----------------------------------------------------------------------------
number:
  # ADDITIONAL fine calibration against a trusted reference thermometer, on
  # top of the built-in S360_200_R4_CLIMATE_PROFILE_V1 factory compensation.
  # Applied once, inside the engine. Neutral default stays 0, and with the
  # factory profile in place a normal customer correction should be SMALL —
  # well under a degree. The ±15 °C range is retained as a protected
  # compatibility contract (it predates the built-in compensation and existing
  # installs pin it), NOT as an expected magnitude: a large value now means an
  # unusual installation or a hardware question, never routine calibration.
  # Restoring a pre-compensation manual offset would double-correct, which is
  # what the persisted schema migration at the top of this file prevents.
  - platform: template
    id: s360_temperature_offset
    name: "Temperature Offset"
    icon: mdi:thermometer-plus
    entity_category: config
    unit_of_measurement: "°C"
    mode: box
    min_value: -15
    max_value: 15
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true
    # Re-evaluating recalculates immediately from the latest raw pair while it
    # is still fresh, and the evaluate script republishes. The temperature
    # offset legitimately moves HUMIDITY too: relative humidity is recomputed
    # at the corrected temperature, preserving the measured vapour pressure.
    on_value:
      then:
        - script.execute: s360_roomiq_evaluate

  # ADDITIONAL fine calibration against a trusted reference hygrometer,
  # applied once at the very END of the model (after the psychrometric
  # recalculation and the built-in factory residual). A per-device
  # correction, never a sensor-accuracy claim. Neutral default stays 0 and a
  # normal customer correction should be small; the ±30 %RH range is likewise
  # a retained compatibility contract, not an expected magnitude.
  - platform: template
    id: s360_humidity_offset
    name: "Humidity Offset"
    icon: mdi:water-plus
    entity_category: config
    unit_of_measurement: "%"
    mode: box
    min_value: -30
    max_value: 30
    step: 0.5
    initial_value: 0
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: s360_roomiq_evaluate

  # A multiplier, not an offset: ambient-light error is dominated by
  # multiplicative effects (gain, diffuser attenuation, mounting position),
  # so a scale factor is the least misleading calibration model. 1.0 is
  # neutral.
  - platform: template
    id: s360_illuminance_scale
    name: "Illuminance Calibration"
    icon: mdi:brightness-percent
    entity_category: config
    mode: box
    min_value: 0.2
    max_value: 5.0
    step: 0.05
    initial_value: 1.0
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: s360_roomiq_evaluate
