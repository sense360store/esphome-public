---
# ============================================================================
# FIRMWARE BUILD & RELEASE WORKFLOW
# ============================================================================
# This workflow automates the build and release of ESPHome firmware binaries
# for all Sense360 products. It integrates with WebFlash for browser-based
# device flashing.
#
# Triggers:
#   - Release creation (published)
#
# This workflow is automatic only: it fires on the GitHub `release`
# (published) event and derives version + channel from the release tag.
# There is no manual trigger. Test builds are covered by compile-only.yml
# and preview-compile-dryrun.yml; release-plan preview is covered by
# create-release.yml.
#
# Process:
#   1. Generate build matrix from products directory
#   2. Build all product configurations using ESPHome
#   3. Rename binaries to WebFlash-compatible format
#   4. Generate checksums and sign checksums-sha256.txt with keyless
#      cosign (SEC-ESP-CHECKSUM-SIGNING-001; consumer verification recipe
#      in docs/security/checksums-verification.md)
#   5. Attach binaries, checksums, signature + signing certificate to the
#      GitHub release
#   6. After a successful attach, hand off downstream (CI-PIPELINE-CLARITY-002):
#      validate the release metadata + the remotely attached asset set and
#      dispatch the combined WebFlash firmware-intake workflow for the
#      selected config (stable/preview channels only). WebFlash owns all
#      final import eligibility decisions; the handoff carries no authority.
#
# Output Format:
#   Sense360-[Product]-[Variant]-v[Version]-[Channel].bin
#
# ============================================================================

name: "Release 3: Build & Release (auto on publish)"

on:
  release:
    types: [published]

# Ensure only one release workflow runs at a time
concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

# SECURITY-AUDIT-FIX-001: least-privilege top-level token scope. Only the
# `release` job uploads release assets, and it requests `contents: write`
# at the job level (see below). The matrix-generation, build, and summary
# jobs only read the repo and exchange CI artifacts (via the artifact
# service, which does not use the `contents` scope), so the workflow-level
# default is pinned to read-only.
permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.4.5"

jobs:
  # ============================================================================
  # JOB 1: GENERATE BUILD MATRIX
  # ============================================================================
  # Scans the products directory and generates a build matrix for all
  # product configurations.
  # ============================================================================
  generate-matrix:
    name: Generate Build Matrix
    # Automatic only: the build chain runs exclusively on the published
    # release event.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      product_count: ${{ steps.generate.outputs.product_count }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      # CI-PIPELINE-CLARITY-002: the trusted set of config strings actually
      # built for this (version, channel), space-separated. The WebFlash
      # handoff requires the untrusted release body's config string to be a
      # member of this set, so a multi-config release cannot hand off a
      # co-built-but-unselected config.
      built_config_strings: ${{ steps.generate.outputs.built_config_strings }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Determine version and channel
        id: version
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          # RELEASE-004: tag normalization is delegated to a tested
          # script so preview tags can carry a suffix
          # (e.g. v1.0.0-led-preview) while still resolving to the
          # semver in config/webflash-builds.json. The script writes
          # version= and channel= to $GITHUB_OUTPUT.
          python3 scripts/derive_release_version_channel.py
          VERSION="$(grep '^version=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          CHANNEL="$(grep '^channel=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"

          echo "Building version: $VERSION (channel: $CHANNEL)"

      - name: Generate product build matrix
        id: generate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail

          # ESP-007: the release/build matrix is driven by
          # config/webflash-builds.json, filtered by the version + channel
          # derived from the release tag. This replaces the previous broad
          # `find products/` scan, which built every legacy / reference /
          # blocked product (including FanTRIAC) when a real Release was
          # published. The WebFlash build matrix is the single source of
          # truth for what release publishing ships.
          #
          # When a JSON entry points at a products/webflash/* wrapper, we
          # compile the canonical products/sense360-<stem>.yaml instead.
          # The wrapper changes ESPHome's config_dir to products/webflash/,
          # which breaks the `path: ../components` rewrite emitted by the
          # external_components patch step (that path resolves to
          # products/components from the wrapper's config_dir). The
          # WebFlash artifact name is still produced because
          # scripts/product_name_mapper.py maps the wrapper stem to the
          # same display name as the canonical stem.

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          REPO_ROOT = Path(".").resolve()
          BUILDS_PATH = REPO_ROOT / "config" / "webflash-builds.json"

          version = os.environ["VERSION"]
          channel = os.environ["CHANNEL"]

          if not BUILDS_PATH.is_file():
              sys.exit(f"error: {BUILDS_PATH} does not exist")

          try:
              data = json.loads(BUILDS_PATH.read_text())
          except json.JSONDecodeError as exc:
              sys.exit(f"error: cannot parse {BUILDS_PATH}: {exc}")

          entries = data.get("builds", [])
          if not isinstance(entries, list):
              sys.exit(f"error: {BUILDS_PATH}: 'builds' must be a list")

          rows = []
          for entry in entries:
              if not isinstance(entry, dict):
                  continue
              if entry.get("version") != version:
                  continue
              if entry.get("channel") != channel:
                  continue

              product_yaml = entry.get("product_yaml", "")
              if not product_yaml:
                  sys.exit(
                      f"error: webflash-builds entry missing product_yaml: {entry}"
                  )

              wrapper_stem = Path(product_yaml).stem
              canonical_stem = f"sense360-{wrapper_stem}"

              if product_yaml.startswith("products/webflash/"):
                  canonical_yaml = f"products/{canonical_stem}.yaml"
                  if not (REPO_ROOT / canonical_yaml).is_file():
                      sys.exit(
                          f"error: wrapper {product_yaml} has no canonical "
                          f"product YAML at {canonical_yaml}"
                      )
                  build_file = canonical_yaml
              else:
                  if not (REPO_ROOT / product_yaml).is_file():
                      sys.exit(
                          f"error: product_yaml does not exist: {product_yaml}"
                      )
                  build_file = product_yaml

              rows.append({
                  "product": wrapper_stem,
                  "file": build_file,
                  "artifact_name": entry.get("artifact_name", ""),
                  "config_string": entry.get("config_string", ""),
              })

          if not rows:
              detail = f"version={version!r} channel={channel!r}"
              sys.exit(
                  f"error: no config/webflash-builds.json entries matched {detail}"
              )

          matrix_json = json.dumps({"include": rows}, separators=(",", ":"))
          count = len(rows)

          # CI-PIPELINE-CLARITY-002: the space-separated set of config
          # strings built for this (version, channel). This is the trusted
          # per-release config set the WebFlash handoff cross-checks the
          # untrusted release-body config string against. Config strings
          # never contain whitespace, so a space separator is unambiguous;
          # fail closed if any entry is malformed or duplicated.
          config_strings = []
          seen_config_strings = set()
          for row in rows:
              config_string = row["config_string"]
              if not config_string or " " in config_string:
                  sys.exit(
                      "error: webflash-builds entry has a missing or "
                      f"whitespace config_string: {config_string!r}"
                  )
              if config_string in seen_config_strings:
                  sys.exit(
                      "error: duplicate config_string in the build matrix "
                      f"for version={version} channel={channel}: "
                      f"{config_string!r}"
                  )
              seen_config_strings.add(config_string)
              config_strings.append(config_string)
          built_config_strings = " ".join(config_strings)

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as fh:
                  fh.write(f"matrix={matrix_json}\n")
                  fh.write(f"product_count={count}\n")
                  fh.write(f"built_config_strings={built_config_strings}\n")

          print(f"WebFlash build matrix ({count} entry/entries) "
                f"for version={version} channel={channel}:")
          for row in rows:
              print(
                  f"  - product={row['product']} "
                  f"file={row['file']} "
                  f"artifact={row['artifact_name']}"
              )
          print(f"Matrix JSON: {matrix_json}")
          PY

  # ============================================================================
  # JOB 2: BUILD FIRMWARE
  # ============================================================================
  # Compiles each product configuration and renames the output binary
  # to WebFlash-compatible format.
  # ============================================================================
  build:
    name: "Build: ${{ matrix.product }}"
    needs: generate-matrix
    # Automatic only: runs on the published release event.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up ESPHome build environment
        uses: ./.github/actions/setup-esphome-build
        with:
          # ESPHOME_VERSION is sourced from the workflow env so the value baked
          # into the firmware manifest (esphome_version) and the compile log
          # below stays the single pinned version.
          esphome-version: ${{ env.ESPHOME_VERSION }}
          # The build also writes generated configs under tests/generated/, so
          # secrets are provisioned there and in tests/ as well as at the repo
          # root and products/.
          extra-secrets-dirs: "tests tests/generated"
          # Rewrite packages/base/external_components.yaml to the local
          # components/ tree; the inline product-YAML rewrite below handles any
          # product-level external_components blocks.
          patch-external-components: "true"
          # SEC-ESP-BUILD-GATES-001 (SECURITY-AUDIT-2026-06 H1): release
          # builds no longer bake the shared default API / OTA / web /
          # fallback-AP credentials that used to live here. The posture step
          # below strips those config blocks from packages/base/, so the only
          # secret keys a release product may resolve are the two
          # intentionally-public setup-network credentials (they grant no
          # control over the device's API / OTA / web surfaces — see
          # docs/security/release-firmware-credential-posture.md). If a
          # product YAML still references any other !secret key, ESPHome
          # fails the compile on the missing secret instead of baking a
          # shared value, and the default-credential gate scans every
          # produced binary as the final backstop before publish.
          secrets-content: |
            wifi_ssid: "Sense360_Setup"
            wifi_password: "sense360setup"

      - name: Apply release credential posture (SEC-ESP-BUILD-GATES-001)
        run: |
          # SECURITY-AUDIT-2026-06 H1: released firmware must not carry the
          # shared default API / OTA / web / fallback-AP credentials. This
          # workspace-only patch (never committed — same pattern as the
          # external_components rewrite below) strips api.encryption, the OTA
          # password, the web_server auth block, and the fallback-AP password
          # from packages/base/, so the compiled binaries ship UNPROVISIONED
          # instead of falsely secured with publicly known values.
          # Self-builders are unaffected: the committed YAML keeps !secret and
          # resolves their own secrets.yaml. Fails closed if any base package
          # no longer has the expected shape.
          # See docs/security/release-firmware-credential-posture.md.
          python3 scripts/apply_release_secret_posture.py

      - name: Patch inline external_components in product YAMLs
        run: |
          # The composite action above already rewrote
          # packages/base/external_components.yaml to the local components/
          # tree. Some product YAMLs (e.g.
          # products/sense360-mini-full-ld2412.yaml) declare their own inline
          # external_components block; rewrite any such block to also use the
          # local components/ directory. Path is ../components because product
          # YAMLs live in products/.
          #
          # IMPORTANT: this rewrite happens in the workflow workspace only.
          # It is never committed back to the repo, so end-users consuming
          # this repo as a remote ESPHome package continue to get the
          # git-source version checked into git.
          echo "Searching products/ for inline external_components blocks..."
          python3 - <<'PY'
          import pathlib
          import re

          PRODUCTS = pathlib.Path("products")
          # Match a top-level external_components: block followed by a single
          # git-source entry. Conservative: only rewrites blocks that look
          # exactly like the known shape we ship.
          pattern = re.compile(
              r"^external_components:\s*\n"
              r"(?:[ \t]*#[^\n]*\n)*"
              r"[ \t]*-[ \t]*source:\s*\n"
              r"[ \t]+type:[ \t]*git\s*\n"
              r"[ \t]+url:[ \t]*\S+\s*\n"
              r"[ \t]+ref:[ \t]*\S+\s*\n"
              r"([ \t]+components:[ \t]*\[[^\]]*\]\s*\n)"
              r"(?:[ \t]+refresh:[ \t]*\S+\s*\n)?",
              re.MULTILINE,
          )

          for path in sorted(PRODUCTS.glob("*.yaml")):
              text = path.read_text()
              match = pattern.search(text)
              if not match:
                  continue
              components_line = match.group(1).strip()
              replacement = (
                  "external_components:\n"
                  "  # CI-only override: rewritten to local source by the\n"
                  "  # firmware-build-release workflow.\n"
                  "  - source:\n"
                  "      type: local\n"
                  "      path: ../components\n"
                  f"    {components_line}\n"
              )
              new_text = pattern.sub(replacement, text, count=1)
              path.write_text(new_text)
              print(f"  rewrote inline external_components in {path}")
          PY

          # Sanity check: no committed/inline references should still be
          # pulling from github.com inside the workspace after this step.
          if grep -RIn --include="*.yaml" -E "type:[[:space:]]*git" packages/base products; then
            echo "::warning::Some YAMLs still declare type: git external_components after patch (see above). They will fall back to network cloning."
          else
            echo "All external_components in packages/base and products are now local."
          fi

      - name: Compile firmware
        run: |
          echo "=============================================="
          echo "Compiling: ${{ matrix.file }}"
          echo "ESPHome version: ${{ env.ESPHOME_VERSION }}"
          echo "=============================================="
          # First validate config to catch errors early.
          # Do NOT redirect to /dev/null — we need the real ESPHome error to
          # surface in the workflow log if validation fails.
          esphome config "${{ matrix.file }}"
          echo "Config validation passed, starting compilation..."
          OUTPUT_DIR="firmware-output"
          OUTPUT_FILE="$OUTPUT_DIR/${{ matrix.product }}.bin"
          mkdir -p "$OUTPUT_DIR"
          echo "Requested output file: $OUTPUT_FILE"

          if esphome compile --help 2>&1 | grep -q -- '--output-file'; then
            echo "Using --output-file flag for deterministic binary path"
            COMPILE_CMD=(esphome compile "${{ matrix.file }}" --output-file "$OUTPUT_FILE")
          else
            echo "--output-file flag not available; compiling with default output location"
            COMPILE_CMD=(esphome compile "${{ matrix.file }}")
          fi

          # Compile with verbose output on failure
          if ! "${COMPILE_CMD[@]}"; then
            echo "=============================================="
            echo "COMPILATION FAILED"
            echo "=============================================="
            echo "Showing build directory contents:"
            find .esphome -type f -name "*.log" 2>/dev/null | head -5 | xargs cat 2>/dev/null || true
            exit 2
          fi

      - name: Find and rename firmware binary
        id: rename
        run: |
          set -euo pipefail

          echo "Searching for firmware binary..."

          # Prefer the explicitly requested output file from the compile step
          OUTPUT_FILE="firmware-output/${{ matrix.product }}.bin"
          FIRMWARE_PATH=""

          if [ -f "$OUTPUT_FILE" ]; then
            echo "Found firmware at explicit output path: $OUTPUT_FILE"
            FIRMWARE_PATH="$OUTPUT_FILE"
          else
            echo "Explicit output file not found. Falling back to search in .esphome and build directories..."

            # ESPHome with ESP-IDF outputs to various locations depending on
            # version. `find` can return non-zero (e.g., a missing directory),
            # so each tolerant lookup is suffixed with `|| true` so the strict
            # `set -euo pipefail` mode does not abort the step on a benign
            # not-found result.
            SEARCH_ROOTS=$(find . -type d -name ".esphome" -prune -print 2>/dev/null || true)
            if [ -d build ]; then
              SEARCH_ROOTS="$SEARCH_ROOTS build"
            fi

            for ROOT in $SEARCH_ROOTS; do
              BASE_DIR="$ROOT"
              [ -d "$ROOT/build" ] && BASE_DIR="$ROOT/build"

              # Pattern 1: Standard firmware.bin
              if [ -z "$FIRMWARE_PATH" ]; then
                FIRMWARE_PATH=$(find "$BASE_DIR" -name "firmware.bin" -type f 2>/dev/null | head -1 || true)
              fi

              # Pattern 2: Factory bin (ESP-IDF merged binary for initial flash)
              if [ -z "$FIRMWARE_PATH" ]; then
                FIRMWARE_PATH=$(find "$BASE_DIR" -name "firmware-factory.bin" -type f 2>/dev/null | head -1 || true)
              fi

              # Pattern 3: ESP-IDF style merged binary
              if [ -z "$FIRMWARE_PATH" ]; then
                FIRMWARE_PATH=$(find "$BASE_DIR" -path "*/.pioenvs/*/firmware*.bin" -type f 2>/dev/null | head -1 || true)
              fi

              # Pattern 4: Any .bin file in idedata directory (ESP-IDF)
              if [ -z "$FIRMWARE_PATH" ]; then
                FIRMWARE_PATH=$(find "$BASE_DIR" -path "*/idedata/*" -name "*.bin" -type f 2>/dev/null | grep -v bootloader | head -1 || true)
              fi

              # Pattern 5: Last resort - any firmware*.bin
              if [ -z "$FIRMWARE_PATH" ]; then
                FIRMWARE_PATH=$(find "$BASE_DIR" -name "firmware*.bin" -type f 2>/dev/null | head -1 || true)
              fi
            done
          fi

          if [ -z "$FIRMWARE_PATH" ]; then
            echo "=============================================="
            echo "Error: Could not find compiled firmware binary"
            echo "=============================================="
            echo "Available .bin files:"
            find . -path "*/.esphome/build/*" -type f -name "*.bin" 2>/dev/null || echo "No .bin files found"
            echo ""
            echo "Build directory structure:"
            find . -path "*/.esphome/build" -type d 2>/dev/null || echo "No build directory"
            exit 1
          fi

          echo "Found firmware at: $FIRMWARE_PATH"
          echo "File size: $(stat -c%s "$FIRMWARE_PATH") bytes"

          # Generate WebFlash-compatible filename.
          # `tail -n 1 | tr -d '\r\n'` is a defensive guard: it isolates the
          # final line of stdout and strips any CR/LF so a future debug print
          # in the mapper cannot pollute the captured filename.
          VERSION="${{ needs.generate-matrix.outputs.version }}"
          CHANNEL="${{ needs.generate-matrix.outputs.channel }}"
          WEBFLASH_NAME="$(python3 scripts/product_name_mapper.py "${{ matrix.product }}" "$VERSION" "$CHANNEL" | tail -n 1 | tr -d '\r\n')"

          if [ -z "$WEBFLASH_NAME" ]; then
            echo "ERROR: product_name_mapper.py returned empty filename"
            exit 1
          fi

          case "$WEBFLASH_NAME" in
            *.bin) ;;
            *)
              echo "ERROR: WebFlash filename does not end in .bin: '$WEBFLASH_NAME'"
              exit 1
              ;;
          esac

          echo "Renaming to: $WEBFLASH_NAME"

          # Pre-copy debug: confirm cwd, firmware-output state, and which
          # compiled .bin files exist under products/.esphome.
          echo "--- pre-copy debug ---"
          pwd
          ls -la firmware-output 2>/dev/null || true
          find products/.esphome -type f -name "*.bin" -printf "%p %s bytes\n" 2>/dev/null || true
          echo "----------------------"

          # Create output directory and copy with new name
          mkdir -p firmware-output
          DEST="firmware-output/$WEBFLASH_NAME"
          cp "$FIRMWARE_PATH" "$DEST"

          if [ ! -f "$DEST" ]; then
            echo "ERROR: copied firmware not found at $DEST"
            exit 1
          fi

          SIZE="$(stat -c%s "$DEST")"
          echo "Copied firmware to: $DEST"
          echo "Copied size: $SIZE bytes"

          # A real Release-One binary is ~1MB; anything under 100KB indicates
          # a truncated copy or wrong source path.
          if [ "$SIZE" -lt 102400 ]; then
            echo "ERROR: copied firmware is suspiciously small: $SIZE bytes"
            exit 1
          fi

          # Post-copy debug: confirm the copy landed in firmware-output.
          echo "--- post-copy debug ---"
          pwd
          ls -la firmware-output 2>/dev/null || true
          echo "-----------------------"

          {
            echo "webflash_name=$WEBFLASH_NAME"
            echo "firmware_path=$DEST"
          } >> "$GITHUB_OUTPUT"

      - name: Scan firmware for default credentials (SEC-ESP-BUILD-GATES-001)
        env:
          FIRMWARE_PATH: ${{ steps.rename.outputs.firmware_path }}
        run: |
          # SECURITY-AUDIT-2026-06 H1 + H2 (forward half): fail this product's
          # build immediately if the compiled binary carries any denylisted
          # default / placeholder / burned credential. The release job re-runs
          # the same gate over the full downloaded artifact set as the
          # authoritative pre-publish backstop.
          python3 scripts/check_firmware_default_credentials.py "$FIRMWARE_PATH"

      - name: Assert renamed binary matches WebFlash build matrix
        run: |
          # Fail the build if config/webflash-builds.json declares an
          # artifact for this product at this version+channel and the
          # renamed file's basename does not match. Skipped (exit 0) when
          # no entry matches the product at this version+channel.
          python3 tests/check_webflash_build_output.py \
            --product "${{ matrix.product }}" \
            --version "${{ needs.generate-matrix.outputs.version }}" \
            --channel "${{ needs.generate-matrix.outputs.channel }}" \
            --actual "${{ steps.rename.outputs.firmware_path }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ matrix.product }}
          path: ${{ steps.rename.outputs.firmware_path }}
          retention-days: 7
          if-no-files-found: error

  # ============================================================================
  # JOB 3: RELEASE ATTACHMENT
  # ============================================================================
  # Downloads all compiled binaries, generates checksums, and attaches
  # them to the GitHub release.
  # ============================================================================
  release:
    name: Attach to Release
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    # SECURITY-AUDIT-FIX-001: this is the only job that needs write. It
    # attaches firmware binaries + checksums + manifest to the GitHub
    # Release via softprops/action-gh-release, which requires
    # `contents: write`. Scoped to this job so the rest of the workflow
    # stays read-only.
    #
    # SEC-ESP-CHECKSUM-SIGNING-001 (SECURITY-AUDIT-2026-06 M1):
    # `id-token: write` lets keyless cosign exchange this job's GitHub
    # OIDC token for a short-lived Fulcio signing certificate bound to
    # this workflow's identity, to sign checksums-sha256.txt below.
    # Job-scoped least privilege on purpose: no other job in this
    # workflow (and no other workflow in this repo) requests `id-token`.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all firmware artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: firmware-*
          path: all-firmware
          merge-multiple: true

      - name: List downloaded firmware
        run: |
          echo "Downloaded firmware files:"
          ls -la all-firmware/
          echo ""
          echo "Total files: $(ls -1 all-firmware/*.bin 2>/dev/null | wc -l)"

      - name: Gate release on default-credential scan (SEC-ESP-BUILD-GATES-001)
        run: |
          # SECURITY-AUDIT-2026-06 H1 + H2 (forward half): the permanent
          # pre-publish backstop. Refuse to attach ANY artifact set to the
          # release if any binary carries a denylisted default / placeholder /
          # burned credential, regardless of how build secrets were sourced.
          # Fails closed when there is nothing to scan.
          python3 scripts/check_firmware_default_credentials.py --dir all-firmware

      - name: Generate checksums
        run: |
          cd all-firmware

          # Generate SHA256 checksums
          echo "# SHA256 Checksums" > checksums-sha256.txt
          echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> checksums-sha256.txt
          echo "# Version: ${{ needs.generate-matrix.outputs.version }}" >> checksums-sha256.txt
          echo "# Channel: ${{ needs.generate-matrix.outputs.channel }}" >> checksums-sha256.txt
          echo "" >> checksums-sha256.txt
          sha256sum *.bin >> checksums-sha256.txt

          # Generate MD5 checksums (for compatibility)
          echo "# MD5 Checksums" > checksums-md5.txt
          echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> checksums-md5.txt
          echo "" >> checksums-md5.txt
          md5sum *.bin >> checksums-md5.txt

          echo "Checksums generated:"
          cat checksums-sha256.txt

      # SEC-ESP-CHECKSUM-SIGNING-001 (SECURITY-AUDIT-2026-06 M1): keyless
      # cosign signing of the release checksums. Ordering contract: this
      # runs only AFTER the default-credential gate above has passed and
      # AFTER checksums-sha256.txt has been generated; the upload step
      # below then publishes checksums + .sig + certificate together. A
      # signing failure fails this job before the upload step is reached,
      # so an unsigned checksums file is never published.
      - name: Install cosign (SEC-ESP-CHECKSUM-SIGNING-001)
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          # Pin the cosign CLI itself, not just the installer action, so
          # signing/verification semantics are deterministic across runs.
          cosign-release: "v2.6.3"

      - name: Sign checksums with keyless cosign (SEC-ESP-CHECKSUM-SIGNING-001)
        env:
          # Audit I1 hygiene: bind expansion-context values to env and
          # reference them as quoted shell variables in the script.
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # Keyless flow: cosign exchanges this job's OIDC token (the
          # job-scoped `id-token: write` permission) for a short-lived
          # Fulcio certificate bound to this workflow's identity, signs
          # checksums-sha256.txt, and records the signature in the Rekor
          # transparency log. --yes acknowledges the tlog upload
          # non-interactively. Both outputs are base64-encoded (cosign's
          # sign-blob output format); `cosign verify-blob` consumes them
          # as published.
          cosign sign-blob \
            --yes \
            --output-signature all-firmware/checksums-sha256.txt.sig \
            --output-certificate all-firmware/checksums-sha256.txt.pem \
            all-firmware/checksums-sha256.txt

          # Fail closed if either signing output is missing or empty.
          test -s all-firmware/checksums-sha256.txt.sig
          test -s all-firmware/checksums-sha256.txt.pem

          # Self-check with the exact consumer recipe from
          # docs/security/checksums-verification.md: pins WHO signed (this
          # repo + workflow file + release tag ref, via the Fulcio
          # certificate identity) and the OIDC issuer — not merely that
          # something produced a valid signature.
          WORKFLOW_PATH=".github/workflows/firmware-build-release.yml"
          EXPECTED_IDENTITY="https://github.com/${GH_REPOSITORY}/${WORKFLOW_PATH}@${GH_REF}"
          cosign verify-blob \
            --certificate all-firmware/checksums-sha256.txt.pem \
            --signature all-firmware/checksums-sha256.txt.sig \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            all-firmware/checksums-sha256.txt
          echo "checksums-sha256.txt signed; identity verified: $EXPECTED_IDENTITY"

      - name: Create firmware manifest
        run: |
          VERSION="${{ needs.generate-matrix.outputs.version }}"
          CHANNEL="${{ needs.generate-matrix.outputs.channel }}"

          cat > all-firmware/manifest.json << EOF
          {
            "version": "$VERSION",
            "channel": "$CHANNEL",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_sha": "${{ github.sha }}",
            "esphome_version": "${{ env.ESPHOME_VERSION }}",
            "product_count": ${{ needs.generate-matrix.outputs.product_count }},
            "files": [
          $(ls -1 all-firmware/*.bin 2>/dev/null | while read f; do
            BASENAME=$(basename "$f")
            SHA256=$(sha256sum "$f" | cut -d' ' -f1)
            SIZE=$(stat -c%s "$f")
            echo "    {\"name\": \"$BASENAME\", \"sha256\": \"$SHA256\", \"size\": $SIZE},"
          done | sed '$ s/,$//')
            ]
          }
          EOF

          echo "Manifest created:"
          cat all-firmware/manifest.json

      - name: Validate manifest JSON before upload (SEC-ESP-BUILD-GATES-001)
        run: |
          # security.md finding #5 / SECURITY-AUDIT-2026-06 L3: the manifest
          # above is assembled by shell interpolation; refuse to upload it
          # unless it parses as valid JSON.
          python3 -m json.tool all-firmware/manifest.json > /dev/null
          echo "manifest.json parses as valid JSON"

      - name: Validate WebFlash release notes
        env:
          RELEASE_CHANNEL: ${{ needs.generate-matrix.outputs.channel }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          if not event_path or not Path(event_path).is_file():
              raise SystemExit(
                  "GITHUB_EVENT_PATH is not set or does not exist; "
                  "cannot read release body."
              )
          event = json.loads(Path(event_path).read_text(encoding="utf-8"))
          body = (event.get("release") or {}).get("body") or ""
          Path("release-notes.md").write_text(body, encoding="utf-8")
          print(f"Wrote release-notes.md ({len(body)} bytes)")
          PY

          python3 scripts/validate-webflash-release-notes.py \
            release-notes.md \
            --channel "$RELEASE_CHANNEL"

      - name: Check WebFlash release assets
        run: |
          python3 scripts/check-webflash-release-assets.py \
            --dir all-firmware \
            --version "${{ needs.generate-matrix.outputs.version }}" \
            --channel "${{ needs.generate-matrix.outputs.channel }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            all-firmware/*.bin
            all-firmware/checksums-sha256.txt
            all-firmware/checksums-sha256.txt.sig
            all-firmware/checksums-sha256.txt.pem
            all-firmware/checksums-md5.txt
            all-firmware/manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
          # fail_on_unmatched_files also backstops SEC-ESP-CHECKSUM-SIGNING-001:
          # if the .sig / .pem are ever missing here, the upload fails rather
          # than publishing an unsigned checksums file.
          fail_on_unmatched_files: true

      - name: Release summary
        run: |
          echo "=============================================="
          echo "FIRMWARE RELEASE COMPLETE"
          echo "=============================================="
          echo ""
          echo "Version: ${{ needs.generate-matrix.outputs.version }}"
          echo "Channel: ${{ needs.generate-matrix.outputs.channel }}"
          echo "Products built: ${{ needs.generate-matrix.outputs.product_count }}"
          echo "Git SHA: ${{ github.sha }}"
          echo ""
          echo "Firmware files attached to release:"
          ls -1 all-firmware/*.bin
          echo ""
          echo "checksums-sha256.txt signed (keyless cosign):"
          ls -1 all-firmware/checksums-sha256.txt.sig all-firmware/checksums-sha256.txt.pem
          echo ""
          echo "WebFlash can now sync these binaries via the"
          echo "sync-from-releases.py script."

  # ============================================================================
  # JOB 4: BUILD SUMMARY
  # ============================================================================
  # Emits a non-publishing build summary for the release run, in parallel
  # with the release-attachment job above.
  # ============================================================================
  summary:
    name: Build Summary
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: firmware-*
          path: all-firmware
          merge-multiple: true

      - name: Build summary
        run: |
          echo "=============================================="
          echo "FIRMWARE BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "Version: ${{ needs.generate-matrix.outputs.version }}"
          echo "Channel: ${{ needs.generate-matrix.outputs.channel }}"
          echo "Products built: ${{ needs.generate-matrix.outputs.product_count }}"
          echo ""
          echo "Built firmware files:"
          ls -la all-firmware/
          echo ""
          echo "These binaries are attached to the GitHub release by the"
          echo "release-attachment job."

  # ============================================================================
  # JOB 5: WEBFLASH INTAKE HANDOFF (CI-PIPELINE-CLARITY-002)
  # ============================================================================
  # After the release job has built, verified, signed and ATTACHED the asset
  # set, hand off to the downstream combined WebFlash firmware-intake
  # workflow (sense360store/WebFlash .github/workflows/firmware-intake.yml,
  # "Release: Firmware Intake (combined source + import, one PR)"), which
  # opens ONE reviewed intake PR. A human still merges that PR; the existing
  # WebFlash publish/deploy then runs unchanged. WebFlash Release 4/5 remain
  # the manual recovery path.
  #
  # Trust boundaries (each is locked by tests/test_webflash_intake_handoff.py):
  #   * No repository checkout and no repo-local script runs in this job —
  #     every step is a self-contained inline python3 heredoc.
  #   * The GitHub Release body/tag are UNTRUSTED input. They are read from
  #     GITHUB_EVENT_PATH inside Python (never interpolated into shell) and
  #     validated against strict allowlisted regexes before any use.
  #   * The body's Version/Channel must equal the values Release 3 derived
  #     from the tag (generate-matrix outputs); any mismatch fails closed.
  #   * Channel gate only: stable/preview dispatch; experimental (a channel
  #     the WebFlash intake lanes do not serve) exits successfully without
  #     dispatching. NO upstream eligibility filtering happens here — the
  #     upstream product/catalog status can neither grant nor deny WebFlash
  #     intake. WebFlash's committed eligibility lanes decide the import.
  #   * The required assets are proven against the REMOTE Release via the
  #     GitHub API after the upload (the release: published event predates
  #     the Release 3 uploads, so the event's own assets array is not
  #     trusted for this).
  #   * WEBFLASH_INTAKE_TOKEN (fine-grained; target sense360store/WebFlash
  #     only; Actions: write) is exposed ONLY to the final dispatch step and
  #     is never printed. All other steps use the read-only github.token or
  #     no token at all.
  webflash-handoff:
    name: WebFlash Intake Handoff
    # Success-only dependency on the release-attachment job: no always() /
    # failure() override, so a failed or skipped attach never hands off.
    # The repository pin keeps a fork (or a rename) from dispatching a
    # handoff that claims sense360store/esphome-public provenance.
    needs: [generate-matrix, release]
    if: >-
      github.event_name == 'release' &&
      github.repository == 'sense360store/esphome-public'
    runs-on: ubuntu-latest
    steps:
      # Parse the release event payload with inline Python only. The release
      # body/tag never touch shell: values are read from GITHUB_EVENT_PATH,
      # validated against strict allowlisted regexes, cross-checked against
      # the Release 3 derived version/channel, and only then exported as
      # step outputs (all output values match no-whitespace allowlists, so
      # GITHUB_OUTPUT injection is not possible).
      - name: Parse and validate release metadata (untrusted input)
        id: metadata
        env:
          DERIVED_VERSION: ${{ needs.generate-matrix.outputs.version }}
          DERIVED_CHANNEL: ${{ needs.generate-matrix.outputs.channel }}
          BUILT_CONFIG_STRINGS: >-
            ${{ needs.generate-matrix.outputs.built_config_strings }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def fail(msg):
              print(f"::error::webflash-handoff: {msg}")
              sys.exit(1)

          TAG_RE = re.compile(
              r"^v(\d{1,4}\.\d{1,4}\.\d{1,4})"
              r"(-led-preview|-preview|-experimental)?$"
          )
          CONFIG_RE = re.compile(
              r"^[A-Za-z][A-Za-z0-9]{0,31}(?:-[A-Za-z][A-Za-z0-9]{0,31}){1,7}$"
          )
          VERSION_RE = re.compile(r"^\d{1,4}\.\d{1,4}\.\d{1,4}$")
          CHANNEL_RE = re.compile(r"^(?:stable|preview|experimental)$")
          # Channels the WebFlash firmware-intake workflow serves. This is a
          # transport gate, NOT an eligibility decision: WebFlash owns import
          # eligibility for everything dispatched.
          WEBFLASH_INTAKE_CHANNELS = ("stable", "preview")
          # Tag-suffix coherence (subset check only; the authoritative tag ->
          # (version, channel) mapping already ran in generate-matrix via
          # scripts/derive_release_version_channel.py). A bare tag can be
          # stable or preview (prerelease flag decides), so both are allowed.
          TAG_SUFFIX_TO_CHANNELS = {
              "-led-preview": ("preview",),
              "-preview": ("preview",),
              "-experimental": ("experimental",),
              None: ("stable", "preview"),
          }

          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          if not event_path or not Path(event_path).is_file():
              fail("GITHUB_EVENT_PATH is not set or does not exist")
          try:
              event = json.loads(Path(event_path).read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              fail(f"cannot parse the release event payload as JSON: {exc}")

          release = event.get("release")
          if not isinstance(release, dict):
              fail("release event payload has no 'release' object")

          tag = release.get("tag_name")
          if not isinstance(tag, str):
              fail("release.tag_name is missing or not a string")
          release_id = release.get("id")
          if (not isinstance(release_id, int) or isinstance(release_id, bool)
                  or release_id <= 0):
              fail("release.id is missing or not a positive integer")
          body = release.get("body")
          if not isinstance(body, str) or not body.strip():
              fail("release.body is missing or empty; cannot extract the "
                   "selected config string from the release-notes preamble")
          if len(body) > 1_000_000:
              fail("release.body is implausibly large; refusing to parse")

          tag_match = TAG_RE.fullmatch(tag)
          if not tag_match:
              fail(f"release tag does not match the allowlisted tag shape "
                   f"(vX.Y.Z with an optional -led-preview / -preview / "
                   f"-experimental suffix): {tag!r}")
          tag_version = tag_match.group(1)
          tag_suffix = tag_match.group(2)

          derived_version = os.environ.get("DERIVED_VERSION", "")
          derived_channel = os.environ.get("DERIVED_CHANNEL", "")
          if not VERSION_RE.fullmatch(derived_version):
              fail("generate-matrix derived version has an invalid shape: "
                   f"{derived_version!r}")
          if not CHANNEL_RE.fullmatch(derived_channel):
              fail("generate-matrix derived channel has an invalid shape: "
                   f"{derived_channel!r}")

          # Extract the generated release-notes preamble lines. The preamble
          # (scripts/generate_webflash_release_notes.py) emits exactly one of
          # each label; conflicting duplicates mean a manipulated body, so
          # they fail closed. 'Catalog status' is deliberately NOT read:
          # upstream lifecycle status can neither grant nor deny WebFlash
          # intake (WebFlash owns eligibility).
          LABELS = ("Config string", "Version", "Channel", "Artifact")
          label_re = re.compile(
              r"^(Config string|Version|Channel|Artifact)[ \t]*:[ \t]*(.*?)[ \t]*$"
          )
          found = {}
          for line in body.splitlines():
              match = label_re.match(line.rstrip("\r"))
              if match:
                  found.setdefault(match.group(1), set()).add(match.group(2))
          for label in LABELS:
              if label not in found:
                  fail(f"release body preamble is missing the '{label} :' "
                       "line emitted by the release-notes generator")
              if len(found[label]) != 1:
                  fail(f"release body carries conflicting '{label} :' lines "
                       f"({sorted(found[label])!r}); refusing to guess")

          config_string = next(iter(found["Config string"]))
          body_version = next(iter(found["Version"]))
          body_channel = next(iter(found["Channel"]))
          body_artifact = next(iter(found["Artifact"]))

          if not CONFIG_RE.fullmatch(config_string):
              fail(f"release body config string fails the allowlist regex: "
                   f"{config_string!r}")
          if not VERSION_RE.fullmatch(body_version):
              fail(f"release body Version fails the allowlist regex: "
                   f"{body_version!r}")
          if not CHANNEL_RE.fullmatch(body_channel):
              fail(f"release body Channel fails the allowlist regex: "
                   f"{body_channel!r}")

          # The untrusted body must agree with what Release 3 actually built
          # (version/channel derived from the tag by the tested script).
          if body_version != derived_version:
              fail(f"release body Version {body_version!r} does not equal "
                   f"the Release 3 derived version {derived_version!r}")
          if body_channel != derived_channel:
              fail(f"release body Channel {body_channel!r} does not equal "
                   f"the Release 3 derived channel {derived_channel!r}")

          # The untrusted body's config string must be one of the configs
          # Release 3 actually built for this (version, channel). Without
          # this, a multi-config release (e.g. several preview rows at the
          # same version) whose body was edited to name a different
          # co-built config would still pass the remote-asset check, since
          # every co-built binary is attached. generate-matrix emits this
          # trusted set from config/webflash-builds.json at build time.
          built_config_strings = os.environ.get(
              "BUILT_CONFIG_STRINGS", "").split()
          if not built_config_strings:
              fail("generate-matrix did not report any built config "
                   "strings; refusing to guess the selected config")
          for built in built_config_strings:
              if not CONFIG_RE.fullmatch(built):
                  fail("a built config string reported by generate-matrix "
                       f"fails the allowlist regex: {built!r}")
          if config_string not in built_config_strings:
              fail(f"release body config string {config_string!r} is not "
                   "among the configs Release 3 built for this "
                   f"(version, channel): {built_config_strings!r}")

          if tag_version != derived_version:
              fail(f"tag version {tag_version!r} does not equal the "
                   f"Release 3 derived version {derived_version!r}")
          if derived_channel not in TAG_SUFFIX_TO_CHANNELS[tag_suffix]:
              fail(f"tag suffix {tag_suffix!r} is inconsistent with the "
                   f"Release 3 derived channel {derived_channel!r}")

          expected_artifact = (
              f"Sense360-{config_string}-v{body_version}-{body_channel}.bin"
          )
          if body_artifact != expected_artifact:
              fail(f"release body Artifact {body_artifact!r} does not equal "
                   f"the canonical artifact name {expected_artifact!r}")

          dispatch = derived_channel in WEBFLASH_INTAKE_CHANNELS

          outputs = {
              "release_tag": tag,
              "config_string": config_string,
              "artifact_name": expected_artifact,
              "release_id": str(release_id),
              "dispatch": "true" if dispatch else "false",
          }
          out_path = os.environ.get("GITHUB_OUTPUT")
          if out_path:
              with open(out_path, "a", encoding="utf-8") as fh:
                  for key, value in outputs.items():
                      if not re.fullmatch(r"[A-Za-z0-9._-]+", value):
                          fail(f"refusing to write step output {key}: "
                               "unexpected characters")
                      fh.write(f"{key}={value}\n")

          print(f"Selected config string : {config_string}")
          print(f"Version / channel      : {body_version} / {body_channel} "
                "(equal to the Release 3 derived values)")
          print(f"Release tag / id       : {tag} / {release_id}")
          print(f"Selected artifact      : {expected_artifact}")
          if dispatch:
              print("Channel is served by the WebFlash intake lanes; "
                    "proceeding to remote asset verification.")
          else:
              msg = (
                  f"No WebFlash dispatch: channel '{derived_channel}' is not "
                  "served by the WebFlash firmware-intake lanes (served: "
                  "stable, preview). This is the expected outcome for the "
                  "experimental self-build lane. The upstream release itself "
                  "is complete — firmware was built, verified, signed and "
                  "attached — and no automatic intake was requested."
              )
              print(msg)
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write("## WebFlash intake handoff\n\n")
                      fh.write(f"{msg}\n")
          PY

      # Prove the REMOTE Release now carries the required asset set. The
      # release: published event fires before Release 3 uploads assets, so
      # the event's own assets array proves nothing — query the live Release
      # through the GitHub API instead. Read-only github.token; nothing is
      # downloaded or re-signed here.
      - name: Verify required assets on the remote release
        if: steps.metadata.outputs.dispatch == 'true'
        env:
          GH_API_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          def fail(msg):
              print(f"::error::webflash-handoff: {msg}")
              sys.exit(1)

          ARTIFACT_RE = re.compile(
              r"^Sense360-[A-Za-z][A-Za-z0-9-]{0,127}"
              r"-v\d{1,4}\.\d{1,4}\.\d{1,4}"
              r"-(?:stable|preview|experimental)\.bin$"
          )
          REPO_RE = re.compile(
              r"^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$"
          )

          api_url = os.environ.get(
              "GITHUB_API_URL", "https://api.github.com"
          ).rstrip("/")
          if not (api_url.startswith("https://")
                  or api_url.startswith("http://127.0.0.1:")
                  or api_url.startswith("http://localhost:")):
              fail(f"refusing non-HTTPS GitHub API URL: {api_url!r}")

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          if not REPO_RE.fullmatch(repo):
              fail(f"GITHUB_REPOSITORY has an unexpected shape: {repo!r}")
          release_id = os.environ.get("RELEASE_ID", "")
          if not re.fullmatch(r"\d{1,20}", release_id):
              fail(f"RELEASE_ID has an unexpected shape: {release_id!r}")
          artifact = os.environ.get("ARTIFACT_NAME", "")
          if not ARTIFACT_RE.fullmatch(artifact):
              fail(f"ARTIFACT_NAME has an unexpected shape: {artifact!r}")

          token = os.environ.get("GH_API_TOKEN", "")

          # Refuse HTTP redirects on this token-bearing request. urllib's
          # default opener follows 30x AND re-sends the Authorization header
          # to the redirect target, which could leak github.token to another
          # host. The releases/assets endpoint never legitimately redirects,
          # so a redirect is treated as an error rather than followed.
          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(_NoRedirect())

          def get_json(url):
              last_error = "unknown error"
              for attempt in range(3):
                  if attempt:
                      time.sleep(5)
                  request = urllib.request.Request(url)
                  request.add_header("Accept", "application/vnd.github+json")
                  request.add_header("X-GitHub-Api-Version", "2022-11-28")
                  request.add_header("User-Agent", "sense360-webflash-handoff")
                  if token:
                      request.add_header("Authorization", f"Bearer {token}")
                  try:
                      with opener.open(request, timeout=30) as rsp:
                          return json.loads(rsp.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      last_error = f"HTTP {exc.code} from the GitHub API"
                      if exc.code not in (500, 502, 503, 504):
                          break
                  except urllib.error.URLError as exc:
                      last_error = ("network error reaching the GitHub API: "
                                    f"{exc.reason}")
                  except (ValueError, TimeoutError) as exc:
                      last_error = f"bad response from the GitHub API: {exc}"
              fail(f"could not list the release assets ({last_error}); "
                   "re-run this job once the GitHub API is reachable")

          names = set()
          page = 1
          while True:
              if page > 10:
                  fail("release asset listing did not terminate in 10 pages")
              batch = get_json(
                  f"{api_url}/repos/{repo}/releases/{release_id}/assets"
                  f"?per_page=100&page={page}"
              )
              if not isinstance(batch, list):
                  fail("GitHub API returned a non-list asset payload")
              for item in batch:
                  if isinstance(item, dict) and isinstance(
                          item.get("name"), str):
                      names.add(item["name"])
              if len(batch) < 100:
                  break
              page += 1

          required = {
              artifact,
              "checksums-sha256.txt",
              "checksums-sha256.txt.sig",
              "checksums-sha256.txt.pem",
              "manifest.json",
          }
          missing = sorted(required - names)
          if missing:
              fail("refusing WebFlash dispatch: the remote GitHub Release "
                   f"is missing required assets: {', '.join(missing)} "
                   f"(found {len(names)} attached assets)")

          print(f"Remote release assets verified ({len(names)} attached):")
          print(f"  selected artifact {artifact}")
          print("  plus checksums-sha256.txt / .sig / .pem and manifest.json")
          PY

      # The ONLY step that sees WEBFLASH_INTAKE_TOKEN. It dispatches the
      # combined WebFlash firmware-intake workflow with the minimum
      # trustworthy inputs; version/channel are deliberately omitted so
      # WebFlash derives them from the tag (no duplicated authority). A 204
      # here means only "handoff accepted" — the WebFlash intake run and its
      # reviewed PR are the actual import path, decided entirely by
      # WebFlash's committed eligibility lanes.
      - name: Dispatch WebFlash firmware intake
        if: steps.metadata.outputs.dispatch == 'true'
        env:
          WEBFLASH_INTAKE_TOKEN: ${{ secrets.WEBFLASH_INTAKE_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          CONFIG_STRING: ${{ steps.metadata.outputs.config_string }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          def fail(msg):
              print(f"::error::webflash-handoff: {msg}")
              sys.exit(1)

          WEBFLASH_REPO = "sense360store/WebFlash"
          INTAKE_WORKFLOW = "firmware-intake.yml"
          INTAKE_REF = "main"
          SOURCE_REPO = "sense360store/esphome-public"

          # Dispatch happens for stable/preview only, so the tag allowlist
          # here deliberately EXCLUDES -experimental: even if the channel
          # gate upstream ever broke, this step still refuses an
          # experimental tag.
          TAG_RE = re.compile(
              r"^v\d{1,4}\.\d{1,4}\.\d{1,4}(?:-led-preview|-preview)?$"
          )
          CONFIG_RE = re.compile(
              r"^[A-Za-z][A-Za-z0-9]{0,31}(?:-[A-Za-z][A-Za-z0-9]{0,31}){1,7}$"
          )

          token = os.environ.get("WEBFLASH_INTAKE_TOKEN", "")
          if not token:
              fail(
                  "the WEBFLASH_INTAKE_TOKEN repository secret is not "
                  "configured, so the automatic WebFlash intake could NOT "
                  "be requested. The upstream release itself is already "
                  "valid: the firmware was built, verified, signed and "
                  "attached by the release job. Recovery: run the WebFlash "
                  "intake manually ('Release: Firmware Intake' "
                  "workflow_dispatch in sense360store/WebFlash, or the "
                  "Release 4/5 manual path). To restore automation, create "
                  "WEBFLASH_INTAKE_TOKEN as a fine-grained token scoped to "
                  "the sense360store/WebFlash repository only, with "
                  "Actions: write permission and no Contents access."
              )

          tag = os.environ.get("RELEASE_TAG", "")
          config_string = os.environ.get("CONFIG_STRING", "")
          if not TAG_RE.fullmatch(tag):
              fail(f"refusing dispatch: RELEASE_TAG has an unexpected "
                   f"shape: {tag!r}")
          if not CONFIG_RE.fullmatch(config_string):
              fail(f"refusing dispatch: CONFIG_STRING has an unexpected "
                   f"shape: {config_string!r}")

          api_url = os.environ.get(
              "GITHUB_API_URL", "https://api.github.com"
          ).rstrip("/")
          if not (api_url.startswith("https://")
                  or api_url.startswith("http://127.0.0.1:")
                  or api_url.startswith("http://localhost:")):
              fail(f"refusing non-HTTPS GitHub API URL: {api_url!r}")

          payload = {
              "ref": INTAKE_REF,
              "inputs": {
                  "release_tag": tag,
                  "config_string": config_string,
                  "source_repo": SOURCE_REPO,
                  "dry_run": "false",
              },
          }
          request = urllib.request.Request(
              f"{api_url}/repos/{WEBFLASH_REPO}/actions/workflows/"
              f"{INTAKE_WORKFLOW}/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
          )
          request.add_header("Accept", "application/vnd.github+json")
          request.add_header("X-GitHub-Api-Version", "2022-11-28")
          request.add_header("User-Agent", "sense360-webflash-handoff")
          request.add_header("Content-Type", "application/json")
          request.add_header("Authorization", f"Bearer {token}")

          # Refuse HTTP redirects on this token-bearing request. urllib's
          # default opener follows 30x and re-sends the Authorization header
          # (WEBFLASH_INTAKE_TOKEN) to the redirect target, which could leak
          # the secret to another host. The workflow-dispatch endpoint never
          # legitimately redirects, so a redirect is an error, never
          # followed.
          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(_NoRedirect())

          try:
              with opener.open(request, timeout=30) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              detail = ""
              try:
                  api_message = json.loads(
                      exc.read().decode("utf-8")).get("message", "")
                  if isinstance(api_message, str) and api_message:
                      detail = f": {api_message[:200]}"
              except (ValueError, OSError):
                  pass
              fail(
                  f"WebFlash intake dispatch was refused (HTTP {exc.code}"
                  f"{detail}). The upstream release is unaffected. Re-run "
                  "this job to retry, or use the manual WebFlash intake "
                  "path ('Release: Firmware Intake' workflow_dispatch, or "
                  "Release 4/5)."
              )
          except urllib.error.URLError as exc:
              fail(
                  "could not reach the GitHub API to dispatch the WebFlash "
                  f"intake ({exc.reason}). The upstream release is "
                  "unaffected. Re-run this job to retry, or use the manual "
                  "WebFlash intake path."
              )

          if status != 204:
              fail(f"unexpected HTTP status {status} from the "
                   "workflow-dispatch API (expected 204)")

          print("WebFlash intake handoff ACCEPTED (HTTP 204).")
          print("Acceptance means only that the dispatch request was "
                "received — it is NOT a WebFlash import result. WebFlash's "
                "committed eligibility lanes decide whether and what to "
                "import; watch the 'Release: Firmware Intake' run and its "
                f"reviewed intake PR in {WEBFLASH_REPO}.")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## WebFlash intake handoff\n\n")
                  fh.write(f"- Dispatch accepted for `{config_string}` at "
                           f"tag `{tag}` (HTTP 204).\n")
                  fh.write("- Acceptance is not an import result: WebFlash's "
                           "committed eligibility lanes decide the import. "
                           "Check the 'Release: Firmware Intake' run and its "
                           "reviewed intake PR in sense360store/WebFlash.\n")
          PY
